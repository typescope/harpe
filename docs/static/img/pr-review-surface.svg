<svg viewBox="0 0 720 292" width="720" height="292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prs-title prs-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="prs-title">What the review needs, against what a credential grants</title>
  <desc id="prs-desc">The reviewer needs four operations. The smallest credential that supplies them also grants submitting a review, approving, requesting changes, dismissing reviews and closing the pull request, because permissions are granted per resource class.</desc>

  <defs>
    <marker id="prs-gap" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="720" height="292" fill="#0b0f10"/>

  <!-- ===== what the job needs ===== -->
  <text x="24" y="32" font-size="11" font-weight="600" fill="#42e2b7">WHAT THE REVIEW NEEDS</text>
  <rect x="24" y="44" width="248" height="176" rx="10" fill="#101512" stroke="#42e2b7" stroke-width="1.5"/>

  <g font-size="11.5" font-family="ui-monospace,monospace" fill="#edf3ef">
    <text x="44" y="76">getPR()</text>
    <text x="44" y="112">readFile()</text>
    <text x="44" y="148">findDefinition()</text>
    <text x="44" y="184">saveDraftReview()</text>
  </g>
  <g fill="#42e2b7">
    <circle cx="34" cy="72" r="3"/>
    <circle cx="34" cy="108" r="3"/>
    <circle cx="34" cy="144" r="3"/>
    <circle cx="34" cy="180" r="3"/>
  </g>
  <text x="148" y="205" text-anchor="middle" font-size="10" fill="#77837e">four operations, one of them a write</text>

  <!-- ===== the gap ===== -->
  <line x1="284" y1="132" x2="330" y2="132" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#prs-gap)"/>
  <text x="307" y="122" text-anchor="middle" font-size="10" fill="#f59e0b">granted by</text>

  <!-- ===== what a credential grants ===== -->
  <text x="344" y="32" font-size="11" font-weight="600" fill="#f59e0b">WHAT A CREDENTIAL GRANTS</text>
  <rect x="344" y="44" width="352" height="176" rx="10" fill="#101512" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- wanted, inside the grant -->
  <g font-size="10.5" font-family="ui-monospace,monospace">
    <rect x="362" y="60" width="150" height="24" rx="5" fill="#10201b" stroke="#42e2b7" stroke-width="1"/>
    <text x="372" y="76" fill="#6ed17f">read pull request</text>
    <rect x="362" y="90" width="150" height="24" rx="5" fill="#10201b" stroke="#42e2b7" stroke-width="1"/>
    <text x="372" y="106" fill="#6ed17f">read repository files</text>
    <rect x="362" y="120" width="150" height="24" rx="5" fill="#10201b" stroke="#42e2b7" stroke-width="1"/>
    <text x="372" y="136" fill="#6ed17f">search code</text>
    <rect x="362" y="150" width="150" height="24" rx="5" fill="#10201b" stroke="#42e2b7" stroke-width="1"/>
    <text x="372" y="166" fill="#6ed17f">create pending review</text>
  </g>

  <!-- unwanted, inside the same grant -->
  <g font-size="10.5" font-family="ui-monospace,monospace" fill="#f87171">
    <text x="532" y="76">submit review</text>
    <text x="532" y="97">approve</text>
    <text x="532" y="118">request changes</text>
    <text x="532" y="139">dismiss a review</text>
    <text x="532" y="160">close the pull request</text>
    <text x="532" y="181">edit title and body</text>
  </g>
  <line x1="522" y1="58" x2="522" y2="204" stroke="#293236" stroke-width="1"/>
  <text x="437" y="206" text-anchor="middle" font-size="10" fill="#77837e">wanted</text>
  <text x="604" y="206" text-anchor="middle" font-size="10" fill="#f87171">comes with it</text>

  <!-- ===== caption ===== -->
  <text x="360" y="252" text-anchor="middle" font-size="11.5" fill="#a6b0ab">Permissions are granted per resource class, so the two never line up.</text>
  <text x="360" y="272" text-anchor="middle" font-size="11.5" fill="#a6b0ab">There is no rung that says <tspan font-family="ui-monospace,monospace" fill="#edf3ef">may draft, may not submit</tspan>.</text>
</svg>
