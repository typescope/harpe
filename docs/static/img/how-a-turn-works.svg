<svg viewBox="0 0 680 300" width="680" height="300" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8ec5ff"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#0b0f10"/>

  <!-- ===== entry ===== -->
  <rect x="255" y="24" width="170" height="54" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="340" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">User message</text>
  <text x="340" y="64" text-anchor="middle" font-size="10" fill="#77837e">Agent.ask(...)</text>

  <!-- ===== completed turn ===== -->
  <rect x="30" y="150" width="150" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="105" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Turn complete</text>
  <text x="105" y="194" text-anchor="middle" font-size="10" fill="#6ed17f">return TurnData</text>

  <!-- ===== model ===== -->
  <rect x="255" y="150" width="170" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="340" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Ask model</text>
  <text x="340" y="194" text-anchor="middle" font-size="10" fill="#77837e">answer or tool call</text>

  <!-- ===== tool ===== -->
  <rect x="500" y="150" width="150" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="575" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Run tool</text>
  <text x="575" y="194" text-anchor="middle" font-size="10" fill="#77837e">API · code · workflow</text>

  <!-- ===== flow ===== -->
  <line x1="340" y1="78" x2="340" y2="149" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="255" y1="181" x2="181" y2="181" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="218" y="170" text-anchor="middle" font-size="10" fill="#a6b0ab">final answer</text>
  <line x1="425" y1="181" x2="499" y2="181" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="462" y="170" text-anchor="middle" font-size="10" fill="#a6b0ab">tool call</text>

  <!-- ===== tool result loop ===== -->
  <path d="M575,212 V250 Q575,258 567,258 H355 Q347,258 347,250 V214" fill="none"
        stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#arr-b)"/>
  <text x="461" y="276" text-anchor="middle" font-size="10.5" fill="#8ec5ff">tool result</text>
</svg>
