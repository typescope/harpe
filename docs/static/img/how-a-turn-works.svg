<svg viewBox="0 0 680 300" width="680" height="300" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8ec5ff"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff736b"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#0b0f10"/>

  <!-- ===== entry: trigger + gather context, merged ===== -->
  <rect x="190" y="24" width="170" height="54" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="275" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Prepare LLM task</text>
  <text x="275" y="64" text-anchor="middle" font-size="10" fill="#77837e">on a message · request · tick</text>

  <!-- ===== terminal: reply (a process), emitted by the model ===== -->
  <rect x="18" y="150" width="130" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="83" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Handle result</text>
  <text x="83" y="194" text-anchor="middle" font-size="10" fill="#6ed17f">reply / respond / log</text>

  <!-- ===== loop core ===== -->
  <rect x="190" y="150" width="170" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="275" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">LLM processing</text>
  <text x="275" y="194" text-anchor="middle" font-size="10" fill="#77837e">a tool call, or a final answer</text>

  <rect x="400" y="150" width="104" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="452" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Dispatch</text>
  <text x="452" y="194" text-anchor="middle" font-size="10" fill="#42e2b7">validate · route</text>

  <rect x="548" y="150" width="110" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="603" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Execute tool</text>
  <text x="603" y="194" text-anchor="middle" font-size="10" fill="#77837e">API · code · workflow</text>

  <!-- ===== straight flow arrows ===== -->
  <line x1="275" y1="78"  x2="275" y2="149" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="181" x2="399" y2="181" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="170" text-anchor="middle" font-size="10" fill="#a6b0ab">tool call</text>
  <line x1="504" y1="181" x2="547" y2="181" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- exit: the model emits the reply when done -->
  <line x1="190" y1="181" x2="149" y2="181" stroke="#77837e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="169" y="140" text-anchor="middle" font-size="10" fill="#a6b0ab">when done</text>

  <!-- ===== validation-error loop: Dispatch -> model ===== -->
  <path d="M452,150 V118 Q452,110 444,110 H308 Q300,110 300,118 V148" fill="none"
        stroke="#ff736b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-r)"/>
  <text x="376" y="104" text-anchor="middle" font-size="10" fill="#ff736b">validation error</text>

  <!-- ===== result loop: Tool output -> back to the model ===== -->
  <path d="M603,212 V250 Q603,258 595,258 H290 Q282,258 282,250 V214" fill="none"
        stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#arr-b)"/>
  <text x="442" y="276" text-anchor="middle" font-size="10.5" fill="#8ec5ff">result → back to the LLM</text>
</svg>
