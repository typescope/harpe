<svg viewBox="0 0 720 170" width="720" height="170" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="title">The usual JSON round trip</title>
  <desc id="desc">A model produces text. The text is JSON whose shape is not guaranteed. The application parses and validates it, which may fail and force another request to the model. Only after that does the value reach application code as a typed value.</desc>

  <defs>
    <marker id="so-json-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="so-json-arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="720" height="170" fill="#0b0f10"/>

  <rect x="24" y="40" width="140" height="64" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="94" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Model</text>
  <text x="94" y="85" text-anchor="middle" font-size="10" fill="#77837e">produces text</text>

  <rect x="204" y="40" width="152" height="64" rx="8" fill="#101512" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">JSON text</text>
  <text x="280" y="85" text-anchor="middle" font-size="10" fill="#f59e0b">shape not guaranteed</text>

  <rect x="396" y="40" width="140" height="64" rx="8" fill="#101512" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="466" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Parse + validate</text>
  <text x="466" y="85" text-anchor="middle" font-size="10" fill="#f59e0b">may fail, re-ask</text>

  <rect x="576" y="40" width="120" height="64" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="636" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Application</text>
  <text x="636" y="85" text-anchor="middle" font-size="10" fill="#77837e">typed at last</text>

  <line x1="164" y1="72" x2="202" y2="72" stroke="#77837e" stroke-width="1.6" marker-end="url(#so-json-arrow)"/>
  <line x1="356" y1="72" x2="394" y2="72" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#so-json-arrow-amber)"/>
  <line x1="536" y1="72" x2="574" y2="72" stroke="#77837e" stroke-width="1.6" marker-end="url(#so-json-arrow)"/>

  <path d="M466,104 V126 H280 V106" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#so-json-arrow-amber)"/>
  <text x="373" y="141" text-anchor="middle" font-size="10.5" fill="#a6b0ab">on invalid output, ask again</text>

</svg>
