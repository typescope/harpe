<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">The program reaches the data only through the interface</title>
<desc id="desc">The program the AI wrote calls a Jo interface, which is checked at compile time. Through it the program reads stand-in labels, purchase dates, basket amounts, and open coupons without their codes, and writes only draft offers. A program that reads a name or calls the network, database, or approval fails to compile. Trusted code implements the interface and does the work on the data. It holds the store access key and the mapping from stand-in labels to real customer IDs, checks the limits and the budget, and generates coupon codes. The owner approves each draft before it becomes a coupon.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="370" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The program reaches the data only through the interface</text>

<rect x="28" y="68" width="280" height="272" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="168" y="102" font-size="17" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="52" y="130" width="150" height="9" rx="4"/>
<rect x="68" y="148" width="120" height="9" rx="4"/>
<rect x="68" y="166" width="170" height="9" rx="4"/>
<rect x="52" y="184" width="90" height="9" rx="4"/>
</g>
<line x1="50" y1="214" x2="286" y2="214" stroke="#e1e9e3"/>
<g font-size="14" fill="#9b4c2d">
<text x="50" y="244">Reads a name: no such field</text>
<text x="50" y="272">Calls the network, database,</text>
<text x="50" y="294">or approval: compile error</text>
</g>

<line x1="310" y1="190" x2="346" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="350" y="68" width="270" height="272" rx="10" fill="#e3ede6" stroke="#9aafa0" stroke-width="2"/>
<text x="485" y="102" font-size="17" font-weight="600" text-anchor="middle">Jo interface</text>
<text x="485" y="122" font-size="12" fill="#63766a" text-anchor="middle">checked at compile time</text>
<text x="372" y="160" font-size="15" font-weight="600">Reads</text>
<g font-size="14">
<text x="372" y="184">customer-1, customer-2, …</text>
<text x="372" y="206">purchase dates</text>
<text x="372" y="228">basket amounts</text>
<text x="372" y="250">open coupons, no codes</text>
</g>
<text x="372" y="284" font-size="15" font-weight="600">Writes</text>
<text x="372" y="308" font-size="14">draft offers</text>

<line x1="622" y1="190" x2="658" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="662" y="68" width="270" height="272" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="797" y="102" font-size="17" font-weight="600" text-anchor="middle">Trusted implementation</text>
<text x="797" y="122" font-size="12" fill="#63766a" text-anchor="middle">does the work on the data</text>
<g font-size="14">
<text x="684" y="160">Store access key</text>
<text x="684" y="184">customer-1 → real customer ID</text>
<text x="684" y="206">Checks limits and budget</text>
<text x="684" y="228">Generates coupon codes</text>
</g>
<line x1="684" y1="254" x2="910" y2="254" stroke="#e1e9e3"/>
<g font-size="14" fill="#63766a">
<text x="684" y="284">Owner approves each draft</text>
<text x="684" y="306">before it becomes a coupon</text>
</g>
</g></svg>
