<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">Limits set before the program exists</title>
<desc id="desc">The owner's application holds the Shopify access key, the mapping from stand-in labels to real customer IDs, and approval. Names and addresses are never imported. Between the application and the AI-written program sits a Jo interface, checked before the program runs. Through it the program sees stand-in labels, purchase dates, and basket amounts, and can only save draft offers. A program that reads a name or calls anything else is rejected before it runs.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="370" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The limits are set before the program exists</text>

<rect x="28" y="68" width="370" height="272" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="50" y="102" font-size="17" font-weight="600">Owner’s application</text>
<g font-size="15">
<text x="50" y="140">Shopify access key</text>
<text x="50" y="170">customer-1 → real Shopify ID</text>
<text x="50" y="200">Owner approval</text>
</g>
<line x1="50" y1="228" x2="376" y2="228" stroke="#e1e9e3"/>
<text x="50" y="260" font-size="14" fill="#63766a">Names and addresses are never</text>
<text x="50" y="282" font-size="14" fill="#63766a">imported from Shopify</text>

<rect x="440" y="68" width="220" height="272" rx="10" fill="#e3ede6" stroke="#9aafa0" stroke-width="2"/>
<text x="550" y="102" font-size="17" font-weight="600" text-anchor="middle">Jo interface</text>
<text x="550" y="122" font-size="12" fill="#63766a" text-anchor="middle">checked before the program runs</text>
<text x="462" y="160" font-size="15" font-weight="600">Sees</text>
<g font-size="14">
<text x="462" y="184">customer-1, customer-2, …</text>
<text x="462" y="206">purchase dates</text>
<text x="462" y="228">basket amounts</text>
</g>
<text x="462" y="270" font-size="15" font-weight="600">Does</text>
<text x="462" y="294" font-size="14">save draft offers</text>

<line x1="398" y1="190" x2="436" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="190" x2="698" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="702" y1="290" x2="664" y2="290" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="290" x2="402" y2="290" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="702" y="68" width="230" height="272" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="817" y="102" font-size="17" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="726" y="126" width="150" height="9" rx="4"/>
<rect x="742" y="144" width="120" height="9" rx="4"/>
<rect x="742" y="162" width="160" height="9" rx="4"/>
<rect x="726" y="180" width="90" height="9" rx="4"/>
</g>
<line x1="724" y1="214" x2="910" y2="214" stroke="#e1e9e3"/>
<g font-size="14" fill="#9b4c2d">
<text x="724" y="244">Reads a name: no such field</text>
<text x="724" y="272">Calls the network, database,</text>
<text x="724" y="294">or approval: rejected</text>
<text x="724" y="316">before it runs</text>
</g>
</g></svg>
