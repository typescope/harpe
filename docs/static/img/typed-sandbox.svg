<svg viewBox="0 0 740 310" width="740" height="310" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <defs>
    <marker id="ts-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f8f3a"/>
    </marker>
    <marker id="ts-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
    <pattern id="dmz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#fdf2c9"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#c59a1e" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- ===== the compiled program (outer) ===== -->
  <rect x="20" y="46" width="540" height="250" rx="12" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.5"/>
  <text x="290" y="68" text-anchor="middle" font-size="10.5" fill="#999">the compiled program</text>

  <!-- ===== guest — the inner sandbox; hatched border = the DMZ ===== -->
  <rect x="44" y="92" width="200" height="176" rx="8" fill="url(#dmz)" stroke="#b8860b" stroke-width="1.2"/>
  <rect x="53" y="101" width="182" height="158" rx="5" fill="#fff" stroke="#e3cf85" stroke-width="1"/>
  <text x="144" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#333">guest</text>
  <text x="144" y="192" text-anchor="middle" font-size="10" fill="#888">LLM-generated code</text>

  <!-- ===== runtime (trusted) ===== -->
  <rect x="380" y="92" width="160" height="176" rx="8" fill="#fff" stroke="#d4d4d4" stroke-width="1.5"/>
  <text x="460" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#333">runtime</text>
  <text x="460" y="192" text-anchor="middle" font-size="10" fill="#888">trusted</text>

  <!-- ===== the world (a cloud, outside the program) ===== -->
  <g fill="#eaf0f6">
    <ellipse cx="662" cy="190" rx="58" ry="24"/>
    <circle cx="632" cy="184" r="22"/>
    <circle cx="656" cy="168" r="26"/>
    <circle cx="686" cy="170" r="24"/>
    <circle cx="706" cy="186" r="20"/>
    <circle cx="668" cy="196" r="30"/>
  </g>
  <text x="664" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#4a5a6a">the world</text>

  <!-- ===== api: typed holes through the guest's border, linking to runtime ===== -->
  <g>
    <line x1="246" y1="124" x2="379" y2="124" stroke="#2f8f3a" stroke-width="1.8" marker-end="url(#ts-g)"/>
    <line x1="246" y1="176" x2="379" y2="176" stroke="#2f8f3a" stroke-width="1.8" marker-end="url(#ts-g)"/>
    <line x1="246" y1="228" x2="379" y2="228" stroke="#2f8f3a" stroke-width="1.8" marker-end="url(#ts-g)"/>
  </g>
  <g fill="#eef6ee" stroke="#2f8f3a" stroke-width="1.8">
    <circle cx="239" cy="124" r="8"/>
    <circle cx="239" cy="176" r="8"/>
    <circle cx="239" cy="228" r="8"/>
  </g>
  <text x="315" y="116" text-anchor="middle" font-size="10.5" fill="#2f6b33" font-family="ui-monospace,monospace">stdout</text>
  <text x="315" y="168" text-anchor="middle" font-size="10.5" fill="#2f6b33" font-family="ui-monospace,monospace">clock</text>
  <text x="315" y="220" text-anchor="middle" font-size="10.5" fill="#2f6b33" font-family="ui-monospace,monospace">payment</text>
  <text x="315" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#333">api</text>

  <!-- ===== runtime performs the real effects ===== -->
  <line x1="540" y1="180" x2="608" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#ts-arr)"/>
</svg>
