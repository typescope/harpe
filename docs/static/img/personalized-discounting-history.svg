<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
<title id="title">The same inactivity, two different buying patterns</title>
<desc id="desc">Both customers last bought thirty days ago. One normally returns every ten days and is overdue. The other returns every sixty days and is not yet due.</desc>
<rect width="960" height="290" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">Both last purchased 30 days ago</text>
<rect x="28" y="68" width="442" height="190" rx="10" fill="white" stroke="#c5d5ca"/>
<rect x="490" y="68" width="442" height="190" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="50" y="104" font-size="17" font-weight="600">The ten-day regular</text>
<text x="512" y="104" font-size="17" font-weight="600">The sixty-day buyer</text>
<path d="M60 150H435 M523 150H898" stroke="#9aafa0" stroke-width="2"/>
<g fill="#2e7050"><circle cx="60" cy="150" r="7"/><circle cx="135" cy="150" r="7"/><circle cx="210" cy="150" r="7"/><circle cx="523" cy="150" r="7"/></g>
<g fill="white" stroke="#a7b8ae" stroke-width="2"><circle cx="285" cy="150" r="7"/><circle cx="360" cy="150" r="7"/><circle cx="435" cy="150" r="7"/><circle cx="898" cy="150" r="7"/></g>
<path d="M435 132V172 M710 132V172" stroke="#af6945" stroke-width="2"/>
<g font-size="12" fill="#63766a"><text x="180" y="189">Last purchase</text><text x="415" y="189">Today</text><text x="512" y="189">Last purchase</text><text x="690" y="189">Today</text><text x="832" y="189">Next expected</text></g>
<text x="50" y="235" font-size="16" fill="#9b4c2d">Two expected purchases missed</text>
<text x="512" y="235" font-size="16">Still within the normal buying interval</text>
</g></svg>
