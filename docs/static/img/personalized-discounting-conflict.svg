<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">The task needs two fields, the program can reach them all</title>
<desc id="desc">A Shopify order holds a customer's name, email, home address, a delivery note the customer typed, the order date, and the amount. A discount rule needs only the date and the amount. A program written by AI, which nobody reads, can reach every field. Anything it prints goes to the AI provider and its logs, and its results become live coupons the shop must honor.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="340" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The task needs two fields. The program can reach them all.</text>

<rect x="28" y="68" width="360" height="248" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="50" y="102" font-size="17" font-weight="600">A Shopify order</text>
<g font-size="15">
<circle cx="56" cy="133" r="5" fill="#af6945"/><text x="72" y="138">Name</text>
<circle cx="56" cy="163" r="5" fill="#af6945"/><text x="72" y="168">Email</text>
<circle cx="56" cy="193" r="5" fill="#af6945"/><text x="72" y="198">Home address</text>
<circle cx="56" cy="223" r="5" fill="#af6945"/><text x="72" y="228">Note: “give me 50% off”</text>
<circle cx="56" cy="253" r="5" fill="#2e7050"/><text x="72" y="258">Order date</text>
<circle cx="56" cy="283" r="5" fill="#2e7050"/><text x="72" y="288">Amount</text>
</g>
<g font-size="13" text-anchor="end">
<text x="366" y="138" fill="#9b4c2d">private</text>
<text x="366" y="168" fill="#9b4c2d">private</text>
<text x="366" y="198" fill="#9b4c2d">private</text>
<text x="366" y="228" fill="#9b4c2d">typed by customer</text>
<text x="366" y="258" fill="#2e7050">needed</text>
<text x="366" y="288" fill="#2e7050">needed</text>
</g>

<line x1="388" y1="192" x2="436" y2="192" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="440" y="112" width="220" height="160" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="550" y="146" font-size="17" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="464" y="164" width="150" height="9" rx="4"/>
<rect x="480" y="182" width="120" height="9" rx="4"/>
<rect x="480" y="200" width="140" height="9" rx="4"/>
<rect x="464" y="218" width="90" height="9" rx="4"/>
</g>
<text x="550" y="254" font-size="15" fill="#9b4c2d" text-anchor="middle">Nobody reads it</text>

<line x1="660" y1="170" x2="706" y2="130" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="214" x2="706" y2="254" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="710" y="84" width="222" height="92" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="730" y="120" font-size="17" font-weight="600">AI provider and logs</text>
<text x="730" y="148" font-size="13" fill="#63766a">anything the program prints</text>

<rect x="710" y="208" width="222" height="92" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="730" y="244" font-size="17" font-weight="600">Live coupons</text>
<text x="730" y="272" font-size="13" fill="#63766a">that the shop must honor</text>
</g></svg>
