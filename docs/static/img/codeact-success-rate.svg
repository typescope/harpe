<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ca-title ca-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="ca-title">Task success rate by action format, on M³ToolEval</title>
  <desc id="ca-desc">Success rate for three action formats on the M³ToolEval benchmark. GPT-4-1106: code 74.4 percent, JSON 52.4 percent, text 53.7 percent. Claude-2: code 54.9 percent, JSON 39.0 percent, text 29.3 percent. GPT-3.5-turbo-0613: code 51.2 percent, JSON 26.8 percent, text 20.7 percent. These are three of the seventeen models evaluated, and code won on twelve of the seventeen.</desc>

  <rect width="760" height="300" fill="#0b0f10"/>

  <text x="30" y="38" font-size="11.5" font-weight="600" fill="#edf3ef">M³ToolEval · task success rate</text>

  <!-- legend: identity is carried by the legend and by the value labels, not by colour alone -->
  <g font-size="10.5" fill="#a6b0ab">
    <rect x="500" y="28" width="10" height="10" rx="2" fill="#42e2b7"/>
    <text x="516" y="37">code</text>
    <rect x="576" y="28" width="10" height="10" rx="2" fill="#8ec5ff"/>
    <text x="592" y="37">JSON</text>
    <rect x="652" y="28" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="668" y="37">text</text>
  </g>

  <!-- grid, recessive -->
  <g stroke="#1c2326" stroke-width="1">
    <line x1="100" y1="112.5" x2="700" y2="112.5"/>
    <line x1="100" y1="155" x2="700" y2="155"/>
    <line x1="100" y1="197.5" x2="700" y2="197.5"/>
  </g>
  <line x1="100" y1="240" x2="700" y2="240" stroke="#293236" stroke-width="1.5"/>
  <g font-size="9" fill="#77837e" text-anchor="end">
    <text x="88" y="116">60%</text>
    <text x="88" y="158.5">40</text>
    <text x="88" y="201">20</text>
    <text x="88" y="243.5">0</text>
  </g>

  <!-- GPT-4-1106 -->
  <g fill="#42e2b7">
    <path d="M132,240 V85.9 Q132,81.9 136,81.9 H172 Q176,81.9 176,85.9 V240 Z"/>
  </g>
  <g fill="#8ec5ff">
    <path d="M178,240 V132.7 Q178,128.7 182,128.7 H218 Q222,128.7 222,132.7 V240 Z"/>
  </g>
  <g fill="#f59e0b">
    <path d="M224,240 V129.9 Q224,125.9 228,125.9 H264 Q268,125.9 268,129.9 V240 Z"/>
  </g>

  <!-- Claude-2 -->
  <g fill="#42e2b7">
    <path d="M332,240 V127.3 Q332,123.3 336,123.3 H372 Q376,123.3 376,127.3 V240 Z"/>
  </g>
  <g fill="#8ec5ff">
    <path d="M378,240 V161.1 Q378,157.1 382,157.1 H418 Q422,157.1 422,161.1 V240 Z"/>
  </g>
  <g fill="#f59e0b">
    <path d="M424,240 V181.7 Q424,177.7 428,177.7 H464 Q468,177.7 468,181.7 V240 Z"/>
  </g>

  <!-- GPT-3.5-turbo-0613 -->
  <g fill="#42e2b7">
    <path d="M532,240 V135.2 Q532,131.2 536,131.2 H572 Q576,131.2 576,135.2 V240 Z"/>
  </g>
  <g fill="#8ec5ff">
    <path d="M578,240 V187.1 Q578,183.1 582,183.1 H618 Q622,183.1 622,187.1 V240 Z"/>
  </g>
  <g fill="#f59e0b">
    <path d="M624,240 V200 Q624,196 628,196 H664 Q668,196 668,200 V240 Z"/>
  </g>

  <!-- values, in text ink rather than in the series colour -->
  <g font-size="9.5" text-anchor="middle" fill="#a6b0ab">
    <text x="154" y="75.9" fill="#edf3ef">74.4</text>
    <text x="200" y="122.7">52.4</text>
    <text x="246" y="119.9">53.7</text>

    <text x="354" y="117.3" fill="#edf3ef">54.9</text>
    <text x="400" y="151.1">39.0</text>
    <text x="446" y="171.7">29.3</text>

    <text x="554" y="125.2" fill="#edf3ef">51.2</text>
    <text x="600" y="177.1">26.8</text>
    <text x="646" y="190">20.7</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="#edf3ef">
    <text x="200" y="260">GPT-4-1106</text>
    <text x="400" y="260">Claude-2</text>
    <text x="600" y="260">GPT-3.5-turbo</text>
  </g>

  <text x="30" y="286" font-size="9.5" fill="#77837e">Three of the 17 models evaluated. Across all 17, code came first on 12.</text>
</svg>
