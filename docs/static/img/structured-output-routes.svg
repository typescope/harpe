<svg viewBox="0 0 720 280" width="720" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="title">Two routes from a model turn to structured output</title>
  <desc id="desc">A model turn produces structure by one of two routes. It writes a Jo program, whose types the compiler checks before it reaches a capability such as an API, database, or file. Or it emits a message together with a typed tool call, whose arguments the tool declaration checks, and the driver reads that call from the transcript and renders it, for example as an attachment on the reply. Neither route serializes the data as text for the application to parse.</desc>

  <defs>
    <marker id="so-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#42e2b7"/>
    </marker>
    <marker id="so-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8ec5ff"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="#0b0f10"/>

  <rect x="24" y="104" width="126" height="72" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="87" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Model turn</text>
  <text x="87" y="154" text-anchor="middle" font-size="10" fill="#77837e">one exchange</text>

  <rect x="210" y="40" width="176" height="64" rx="8" fill="#101512" stroke="#42e2b7" stroke-width="1.5"/>
  <text x="298" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Jo program</text>
  <text x="298" y="85" text-anchor="middle" font-size="10" fill="#42e2b7">the model writes code</text>

  <rect x="470" y="40" width="196" height="64" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="568" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Capability</text>
  <text x="568" y="85" text-anchor="middle" font-size="10" fill="#77837e">API · database · file</text>

  <rect x="210" y="176" width="176" height="64" rx="8" fill="#101512" stroke="#8ec5ff" stroke-width="1.5"/>
  <text x="298" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Message + tool call</text>
  <text x="298" y="221" text-anchor="middle" font-size="10" fill="#8ec5ff">typed arguments</text>

  <rect x="470" y="176" width="196" height="64" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="568" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Driver renders it</text>
  <text x="568" y="221" text-anchor="middle" font-size="10" fill="#77837e">attachment on the reply</text>

  <path d="M150,126 C182,126 178,72 208,72" fill="none" stroke="#42e2b7" stroke-width="1.6" marker-end="url(#so-arrow-green)"/>
  <path d="M150,154 C182,154 178,208 208,208" fill="none" stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#so-arrow-blue)"/>

  <line x1="386" y1="72" x2="468" y2="72" stroke="#42e2b7" stroke-width="1.6" marker-end="url(#so-arrow-green)"/>
  <text x="427" y="62" text-anchor="middle" font-size="10.5" fill="#a6b0ab">compiler checks</text>

  <line x1="386" y1="208" x2="468" y2="208" stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#so-arrow-blue)"/>
  <text x="427" y="198" text-anchor="middle" font-size="10.5" fill="#a6b0ab">driver reads</text>

  <text x="24" y="266" font-size="10.5" fill="#77837e">Neither route serializes the value as text for the application to parse back.</text>

</svg>
