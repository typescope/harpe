<svg viewBox="0 0 760 300" width="760" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="title">Reasoning and tool-call flow</title>
  <desc id="desc">A request enters provider reasoning. The provider either returns final text directly or requests a tool. The client runs the tool and sends its result back for more provider reasoning, which then returns final text.</desc>

  <defs>
    <marker id="reasoning-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="reasoning-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8ec5ff"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#0b0f10"/>

  <text x="26" y="30" font-size="11" font-weight="600" letter-spacing="1" fill="#77837e">PROVIDER</text>
  <line x1="18" y1="194" x2="742" y2="194" stroke="#293236" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="26" y="220" font-size="11" font-weight="600" letter-spacing="1" fill="#77837e">CLIENT</text>

  <rect x="28" y="76" width="112" height="54" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="84" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Request</text>

  <rect x="190" y="76" width="136" height="54" rx="8" fill="#101512" stroke="#42e2b7" stroke-width="1.5"/>
  <text x="258" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Reasoning</text>
  <text x="258" y="117" text-anchor="middle" font-size="10" fill="#42e2b7">inside the provider</text>

  <rect x="594" y="76" width="138" height="54" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="663" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Final text</text>
  <text x="663" y="117" text-anchor="middle" font-size="10" fill="#6ed17f">turn completes</text>

  <rect x="382" y="76" width="132" height="54" rx="8" fill="#101512" stroke="#8ec5ff" stroke-width="1.5"/>
  <text x="448" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Tool call</text>
  <text x="448" y="117" text-anchor="middle" font-size="10" fill="#8ec5ff">external action needed</text>

  <rect x="382" y="226" width="132" height="50" rx="8" fill="#101512" stroke="#8ec5ff" stroke-width="1.5"/>
  <text x="448" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">Run tool</text>
  <text x="448" y="264" text-anchor="middle" font-size="10" fill="#8ec5ff">produce result</text>

  <line x1="140" y1="103" x2="189" y2="103" stroke="#77837e" stroke-width="1.6" marker-end="url(#reasoning-arrow)"/>

  <path d="M326,91 C420,42 530,42 593,91" fill="none" stroke="#77837e" stroke-width="1.6" marker-end="url(#reasoning-arrow)"/>
  <text x="458" y="49" text-anchor="middle" font-size="10.5" fill="#a6b0ab">no tool needed</text>

  <line x1="326" y1="103" x2="381" y2="103" stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#reasoning-arrow-blue)"/>
  <line x1="448" y1="130" x2="448" y2="225" stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#reasoning-arrow-blue)"/>

  <path d="M382,251 H258 Q246,251 246,239 V132" fill="none" stroke="#8ec5ff" stroke-width="1.6" marker-end="url(#reasoning-arrow-blue)"/>
  <text x="300" y="268" text-anchor="middle" font-size="10.5" fill="#8ec5ff">tool result</text>

</svg>
