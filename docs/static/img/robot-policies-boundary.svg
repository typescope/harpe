<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
<title id="title">The program reaches the arm only through the interface</title>
<desc id="desc">The model writes a Jo program. The compiler checks it against the grant: scene and arm after Move, scene only after Ask. A program that names the joint driver, a file or the network is rejected before anything moves. A program that passes calls the Arm interface, whose trusted implementation checks each move against the table and the keep-out zones before the controller moves the arm.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="370" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The program reaches the arm only through the interface</text>

<rect x="28" y="68" width="280" height="272" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="168" y="102" font-size="17" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="52" y="130" width="150" height="9" rx="4"/>
<rect x="68" y="148" width="120" height="9" rx="4"/>
<rect x="68" y="166" width="170" height="9" rx="4"/>
<rect x="52" y="184" width="90" height="9" rx="4"/>
</g>
<line x1="50" y1="214" x2="286" y2="214" stroke="#e1e9e3"/>
<g font-size="14" fill="#9b4c2d">
<text x="50" y="244">Names the joint driver, a file</text>
<text x="50" y="266">or the network: compile error</text>
<text x="50" y="300">Calls the arm after Ask:</text>
<text x="50" y="322">compile error, nothing moves</text>
</g>

<line x1="310" y1="190" x2="346" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="350" y="68" width="270" height="272" rx="10" fill="#e3ede6" stroke="#9aafa0" stroke-width="2"/>
<text x="485" y="102" font-size="17" font-weight="600" text-anchor="middle">Compiler</text>
<text x="485" y="122" font-size="12" fill="#63766a" text-anchor="middle">checks the program against the grant</text>
<text x="372" y="160" font-size="15" font-weight="600">Move</text>
<text x="372" y="184" font-size="14">scene and arm</text>
<text x="372" y="222" font-size="15" font-weight="600">Ask</text>
<text x="372" y="246" font-size="14">scene only</text>
<line x1="372" y1="272" x2="598" y2="272" stroke="#c5d5ca"/>
<g font-size="14" fill="#63766a">
<text x="372" y="298">The operator's button picks</text>
<text x="372" y="320">the grant, not the model</text>
</g>

<line x1="622" y1="190" x2="658" y2="190" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="662" y="68" width="270" height="272" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="797" y="102" font-size="17" font-weight="600" text-anchor="middle">Trusted Arm implementation</text>
<text x="797" y="122" font-size="12" fill="#63766a" text-anchor="middle">never written by the model</text>
<text x="684" y="160" font-size="15" font-weight="600">Checks each move</text>
<g font-size="14">
<text x="684" y="184">inside the table edges</text>
<text x="684" y="206">outside the keep-out zones</text>
<text x="684" y="228">clear of the other parts</text>
<text x="684" y="250">at a speed it chooses</text>
</g>
<line x1="684" y1="272" x2="910" y2="272" stroke="#e1e9e3"/>
<g font-size="14" fill="#63766a">
<text x="684" y="298">Then the controller</text>
<text x="684" y="320">moves the arm</text>
</g>
</g></svg>
