<svg viewBox="0 0 720 276" width="720" height="276" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slp-title slp-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="slp-title">Four depot rules, and what each one costs to support</title>
  <desc id="slp-desc">Four rules a depot runs on, with the work each takes in a conventional planning system. Only the first is a number, so it is typed into an existing settings field. The other three are conditions no field expresses, so each one costs a schema change, a code change and a release.</desc>

  <defs>
    <marker id="slp-arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5c6a64"/>
    </marker>
  </defs>

  <rect width="720" height="276" fill="#0b0f10"/>

  <text x="20" y="26" font-size="11" font-weight="600" fill="#a6b0ab">WHAT THE DEPOT RUNS ON</text>
  <text x="360" y="26" font-size="11" font-weight="600" fill="#a6b0ab">WHAT IT COSTS TO SUPPORT</text>

  <!-- row 1: a number, so it fits a field -->
  <rect x="20" y="40" width="320" height="34" rx="6" fill="#101512" stroke="#42e2b7" stroke-width="1.2"/>
  <text x="34" y="61" font-size="11" fill="#edf3ef">“Food keeps 7 days of cover.”</text>

  <rect x="360" y="40" width="118" height="34" rx="6" fill="#10201b" stroke="#42e2b7" stroke-width="1.2"/>
  <text x="419" y="61" text-anchor="middle" font-size="10.5" fill="#6ed17f">type it in a field</text>

  <!-- rows 2-4: conditions, so each is a release -->
  <g font-size="11">
    <rect x="20" y="88" width="320" height="34" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="34" y="109" fill="#edf3ef">“Nordic shuts down over Christmas.”</text>

    <rect x="20" y="136" width="320" height="34" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="34" y="157" fill="#edf3ef">“Two pallets max — receiving can’t take more.”</text>

    <rect x="20" y="184" width="320" height="34" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="34" y="205" fill="#edf3ef">“Don’t warn on packaging above 3 days.”</text>
  </g>

  <g font-size="10.5" text-anchor="middle">
    <g transform="translate(0,88)">
      <rect x="360" y="0" width="104" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="412" y="21" fill="#f0b45f">schema change</text>
      <line x1="468" y1="17" x2="484" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="490" y="0" width="92" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="536" y="21" fill="#f0b45f">code change</text>
      <line x1="586" y1="17" x2="602" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="608" y="0" width="82" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="649" y="21" fill="#f0b45f">a release</text>
    </g>
    <g transform="translate(0,136)">
      <rect x="360" y="0" width="104" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="412" y="21" fill="#f0b45f">schema change</text>
      <line x1="468" y1="17" x2="484" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="490" y="0" width="92" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="536" y="21" fill="#f0b45f">code change</text>
      <line x1="586" y1="17" x2="602" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="608" y="0" width="82" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="649" y="21" fill="#f0b45f">a release</text>
    </g>
    <g transform="translate(0,184)">
      <rect x="360" y="0" width="104" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="412" y="21" fill="#f0b45f">schema change</text>
      <line x1="468" y1="17" x2="484" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="490" y="0" width="92" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="536" y="21" fill="#f0b45f">code change</text>
      <line x1="586" y1="17" x2="602" y2="17" stroke="#5c6a64" stroke-width="1.3" marker-end="url(#slp-arr)"/>
      <rect x="608" y="0" width="82" height="34" rx="6" fill="#1a1410" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="649" y="21" fill="#f0b45f">a release</text>
    </g>
  </g>

  <line x1="20" y1="238" x2="700" y2="238" stroke="#1c2422" stroke-width="1"/>
  <text x="20" y="260" font-size="11" fill="#a6b0ab">Only the first one is a number. The rest are conditions, and every condition is a release.</text>
</svg>
