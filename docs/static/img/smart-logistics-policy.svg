<svg viewBox="0 0 720 240" width="720" height="240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slp-title slp-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="slp-title">A depot manager’s rules, and the software that cannot hold them</title>
  <desc id="slp-desc">A depot manager states three rules: Nordic shuts down over Christmas, two pallets max because receiving cannot take more, and do not warn on packaging above three days. An arrow marked with a question mark points from those rules to a traditional logistics system, whose settings are single numbers: safety stock 7, reorder point 40, lead time 9. There is no field for any of the three rules.</desc>

  <defs>
    <marker id="slp-arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="720" height="240" fill="#0b0f10"/>

  <!-- the person -->
  <circle cx="65" cy="66" r="13" fill="none" stroke="#a6b0ab" stroke-width="1.6"/>
  <path d="M40,112 C40,88 90,88 90,112" fill="none" stroke="#a6b0ab" stroke-width="1.6"/>
  <text x="65" y="134" text-anchor="middle" font-size="10.5" fill="#a6b0ab">Depot manager</text>

  <!-- what they know -->
  <g font-size="10.5">
    <rect x="130" y="36" width="290" height="30" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="144" y="55" fill="#edf3ef">“Nordic shuts down over Christmas.”</text>
    <rect x="130" y="74" width="290" height="30" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="144" y="93" fill="#edf3ef">“Two pallets max — receiving can’t take more.”</text>
    <rect x="130" y="112" width="290" height="30" rx="6" fill="#101512" stroke="#293236" stroke-width="1.2"/>
    <text x="144" y="131" fill="#edf3ef">“Don’t warn on packaging above 3 days.”</text>
  </g>

  <!-- no way in -->
  <text x="450" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#f0b45f">?</text>
  <line x1="430" y1="106" x2="468" y2="106" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#slp-arr)"/>

  <!-- the system -->
  <rect x="484" y="30" width="216" height="152" rx="8" fill="#101512" stroke="#293236" stroke-width="1.2"/>
  <path d="M484,56 h216" stroke="#293236" stroke-width="1.2"/>
  <text x="496" y="48" font-size="10.5" font-weight="600" fill="#a6b0ab">Traditional logistics software</text>
  <g font-size="10">
    <text x="496" y="90" fill="#a6b0ab">Safety stock</text>
    <rect x="622" y="74" width="62" height="24" rx="4" fill="#10201b" stroke="#42e2b7" stroke-width="1.2"/>
    <text x="653" y="90" text-anchor="middle" fill="#6ed17f">7</text>
    <text x="496" y="124" fill="#a6b0ab">Reorder point</text>
    <rect x="622" y="108" width="62" height="24" rx="4" fill="#10201b" stroke="#42e2b7" stroke-width="1.2"/>
    <text x="653" y="124" text-anchor="middle" fill="#6ed17f">40</text>
    <text x="496" y="158" fill="#a6b0ab">Lead time</text>
    <rect x="622" y="142" width="62" height="24" rx="4" fill="#10201b" stroke="#42e2b7" stroke-width="1.2"/>
    <text x="653" y="158" text-anchor="middle" fill="#6ed17f">9</text>
  </g>

  <line x1="20" y1="206" x2="700" y2="206" stroke="#1c2422" stroke-width="1"/>
  <text x="20" y="228" font-size="11" fill="#a6b0ab">The rules are sentences. The software has number fields. There is no field for any of them.</text>
</svg>
