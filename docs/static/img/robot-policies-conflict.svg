<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">The job needs pick-and-place, the program can reach the whole controller</title>
<desc id="desc">An operator tells the arm to line up the red parts along the top edge, biggest on the left. The AI writes a program for it, and the program runs as soon as it is written, so nobody reads it. It runs inside the robot controller, where it can reach checked pick-and-place, which the job needs, and also the raw joint driver that skips the speed and zone limits, the camera feed that sees the operator, the controller's files, and the factory network.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="340" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The job needs pick-and-place. The program can reach the whole controller.</text>

<rect x="28" y="92" width="226" height="200" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="48" y="126" font-size="17" font-weight="600">The operator says</text>
<g font-size="15" font-style="italic">
<text x="48" y="162">“Line up the red parts</text>
<text x="48" y="186">along the top edge,</text>
<text x="48" y="210">biggest on the left.”</text>
</g>
<g transform="translate(48 236)">
<rect width="30" height="30" rx="4" fill="#d64541"/>
<rect x="38" y="5" width="25" height="25" rx="4" fill="#d64541"/>
<rect x="71" y="10" width="20" height="20" rx="4" fill="#d64541"/>
<rect x="99" y="13" width="17" height="17" rx="3" fill="#d64541"/>
</g>

<line x1="254" y1="192" x2="296" y2="192" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="300" y="112" width="208" height="160" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="404" y="146" font-size="17" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="324" y="166" width="140" height="9" rx="4"/>
<rect x="340" y="184" width="112" height="9" rx="4"/>
<rect x="340" y="202" width="130" height="9" rx="4"/>
<rect x="324" y="220" width="84" height="9" rx="4"/>
</g>
<text x="404" y="256" font-size="13" fill="#63766a" text-anchor="middle">runs as soon as it is written</text>

<line x1="508" y1="192" x2="550" y2="192" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="554" y="68" width="378" height="248" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="576" y="102" font-size="17" font-weight="600">Inside the robot controller</text>
<g font-size="15">
<circle cx="582" cy="138" r="5" fill="#2e7050"/><text x="598" y="143">Pick-and-place, checked</text>
<circle cx="582" cy="172" r="5" fill="#af6945"/><text x="598" y="177">Raw joint driver</text>
<circle cx="582" cy="206" r="5" fill="#af6945"/><text x="598" y="211">Camera feed</text>
<circle cx="582" cy="240" r="5" fill="#af6945"/><text x="598" y="245">Files</text>
<circle cx="582" cy="274" r="5" fill="#af6945"/><text x="598" y="279">Factory network</text>
</g>
<g font-size="13" text-anchor="end">
<text x="910" y="143" fill="#2e7050">needed</text>
<text x="910" y="177" fill="#9b4c2d">skips speed and zone limits</text>
<text x="910" y="211" fill="#9b4c2d">sees the operator</text>
<text x="910" y="245" fill="#9b4c2d">controller settings</text>
<text x="910" y="279" fill="#9b4c2d">other machines</text>
</g>
</g></svg>
