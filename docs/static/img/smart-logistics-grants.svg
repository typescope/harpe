<svg viewBox="0 0 720 340" width="720" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slg-title slg-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="slg-title">One depot, two agents, two grants</title>
  <desc id="slg-desc">Both agents read the same three things: products, demand history and checks. The watcher runs unattended on a schedule and can additionally only save a warning, so its output is notes for a person to read. The planner runs when a person asks and can additionally read open drafts and save a draft order, so its output waits for someone to accept or reject. Neither grant contains an operation to approve an order, send one to a supplier, change a check, or reach a database, file or network.</desc>

  <defs>
    <marker id="slg-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#0b0f10"/>

  <!-- what both grants read -->
  <rect x="24" y="104" width="180" height="100" rx="8" fill="#101512" stroke="#293236" stroke-width="1.2"/>
  <text x="40" y="128" font-size="10.5" font-weight="600" fill="#a6b0ab">Both grants read</text>
  <g font-size="10.5" font-family="ui-monospace,monospace" fill="#edf3ef">
    <text x="40" y="152">products()</text>
    <text x="40" y="172">demandHistory()</text>
    <text x="40" y="192">checks()</text>
  </g>

  <path d="M204,140 C238,140 238,92 266,92" fill="none" stroke="#77837e" stroke-width="1.4" marker-end="url(#slg-arr)"/>
  <path d="M204,168 C238,168 238,246 266,246" fill="none" stroke="#77837e" stroke-width="1.4" marker-end="url(#slg-arr)"/>

  <!-- the watcher -->
  <rect x="270" y="46" width="228" height="92" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="288" y="70" font-size="11.5" font-weight="600" fill="#edf3ef">WATCHER</text>
  <text x="288" y="88" font-size="10" fill="#a6b0ab">runs unattended, on a schedule</text>
  <text x="288" y="120" font-size="11" font-family="ui-monospace,monospace" fill="#42e2b7">+ saveWarning(…)</text>

  <!-- the planner -->
  <rect x="270" y="200" width="228" height="104" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="288" y="224" font-size="11.5" font-weight="600" fill="#edf3ef">PLANNER</text>
  <text x="288" y="242" font-size="10" fill="#a6b0ab">runs when a person asks</text>
  <text x="288" y="268" font-size="11" font-family="ui-monospace,monospace" fill="#42e2b7">+ openDraftOrders()</text>
  <text x="288" y="288" font-size="11" font-family="ui-monospace,monospace" fill="#42e2b7">+ saveDraftOrder(…)</text>

  <line x1="498" y1="92" x2="522" y2="92" stroke="#77837e" stroke-width="1.4" marker-end="url(#slg-arr)"/>
  <line x1="498" y1="252" x2="522" y2="252" stroke="#77837e" stroke-width="1.4" marker-end="url(#slg-arr)"/>

  <!-- what each one can produce -->
  <rect x="526" y="60" width="170" height="66" rx="8" fill="#101512" stroke="#293236" stroke-width="1.2"/>
  <text x="611" y="86" text-anchor="middle" font-size="11.5" fill="#edf3ef">warnings</text>
  <text x="611" y="106" text-anchor="middle" font-size="10" fill="#a6b0ab">advisory, and nothing else</text>

  <rect x="526" y="216" width="170" height="74" rx="8" fill="#101512" stroke="#293236" stroke-width="1.2"/>
  <text x="611" y="244" text-anchor="middle" font-size="11.5" fill="#edf3ef">draft orders</text>
  <text x="611" y="268" text-anchor="middle" font-size="10" fill="#f59e0b">waiting for approval</text>

  <line x1="20" y1="316" x2="700" y2="316" stroke="#1c2422" stroke-width="1"/>
  <text x="20" y="334" font-size="10.5" fill="#a6b0ab">In neither grant: approve an order, send one to a supplier, change a check, or reach a database, file or network.</text>
</svg>
