<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">The same idle capacity can mean different things</title>
<desc id="desc">Billing and usage show three idle workers. Job history reveals a finished job, a recovery role, or missing evidence. The resulting findings are a savings opportunity, necessary spending, and needs investigation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#72867c"/></marker></defs>
<rect width="1000" height="420" rx="18" fill="#f4f6f3"/>
<g font-family="system-ui, sans-serif" fill="#203b37">
<text x="35" y="40" font-size="14" font-weight="700">WHAT THE BILL AND USAGE SHOW</text>
<text x="380" y="40" font-size="14" font-weight="700">WHAT THE CONTEXT ADDS</text>
<text x="748" y="40" font-size="14" font-weight="700">WHAT THE REPORT EXPLAINS</text>
<g fill="#fff" stroke="#dce4de"><rect x="30" y="65" width="270" height="85" rx="10"/><rect x="30" y="180" width="270" height="85" rx="10"/><rect x="30" y="295" width="270" height="85" rx="10"/>
<rect x="375" y="65" width="290" height="85" rx="10"/><rect x="375" y="180" width="290" height="85" rx="10"/><rect x="375" y="295" width="290" height="85" rx="10"/></g>
<g font-size="17"><text x="48" y="100">Worker running, little activity</text><text x="48" y="125" font-size="14" fill="#637771">Billed for six more hours</text>
<text x="48" y="215">Worker running, little activity</text><text x="48" y="240" font-size="14" fill="#637771">Billed for six more hours</text>
<text x="48" y="330">Worker running, little activity</text><text x="48" y="355" font-size="14" fill="#637771">Billed for six more hours</text>
<text x="393" y="100">Job finished. No work waiting.</text><text x="393" y="125" font-size="14" fill="#637771">The allowed grace period has passed.</text>
<text x="393" y="215">Reserved for recovery.</text><text x="393" y="240" font-size="14" fill="#637771">The team needs this worker ready.</text>
<text x="393" y="330">Role and usage are unclear.</text><text x="393" y="355" font-size="14" fill="#637771">The available records are incomplete.</text></g>
<g stroke="#72867c" stroke-width="2" marker-end="url(#arrow)"><path d="M310 107H363"/><path d="M310 222H363"/><path d="M310 337H363"/><path d="M675 107H730"/><path d="M675 222H730"/><path d="M675 337H730"/></g>
<rect x="743" y="65" width="227" height="85" rx="10" fill="#dfefe3"/><rect x="743" y="180" width="227" height="85" rx="10" fill="#e7ecef"/><rect x="743" y="295" width="227" height="85" rx="10" fill="#fff0d5"/>
<g font-size="17" font-weight="650"><text x="760" y="101">Savings opportunity</text><text x="760" y="216">Necessary spending</text><text x="760" y="331">Needs investigation</text></g>
<g font-size="14"><text x="760" y="126">Show the excess cost.</text><text x="760" y="241">Explain its purpose.</text><text x="760" y="356">Show the evidence gap.</text></g>
</g></svg>
