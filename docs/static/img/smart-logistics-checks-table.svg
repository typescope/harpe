<svg viewBox="0 0 720 386" width="720" height="386" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slc-title slc-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="slc-title">Rules are sentences, and the AI turns them into warnings and drafts</title>
  <desc id="slc-desc">The depot manager writes rules straight into the table the system keeps, and every rule is a whole sentence: food keeps 7 days of cover; Nordic shuts down over Christmas, so don't order if it won't arrive first; never propose more than 300 units of one product in a single order. The AI reads every rule, plus the stock and the sales history. On a schedule it produces warnings — a note for a person to read, such as hand soap having 2 days of cover left. When someone asks, it produces draft orders, such as 96 litres of olive oil from Helvetia, and nothing is ordered until someone accepts one.</desc>

  <defs>
    <marker id="slc-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
  </defs>

  <rect width="720" height="386" fill="#0b0f10"/>

  <!-- the person whose rules these are -->
  <circle cx="52" cy="60" r="12" fill="none" stroke="#a6b0ab" stroke-width="1.6"/>
  <path d="M30,104 C30,81 74,81 74,104" fill="none" stroke="#a6b0ab" stroke-width="1.6"/>
  <text x="52" y="126" text-anchor="middle" font-size="10" fill="#a6b0ab">Depot manager</text>
  <text x="52" y="142" text-anchor="middle" font-size="10" fill="#77837e">writes a rule</text>
  <line x1="92" y1="86" x2="124" y2="86" stroke="#77837e" stroke-width="1.4" marker-end="url(#slc-grey)"/>

  <!-- the rules themselves -->
  <rect x="132" y="24" width="568" height="128" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <g font-size="10.5">
    <text x="152" y="56" fill="#77837e">1</text>
    <text x="182" y="56" fill="#edf3ef">“Food keeps 7 days of cover.”</text>

    <path d="M152,74 h528" stroke="#1c2422" stroke-width="1"/>
    <text x="152" y="96" fill="#77837e">2</text>
    <text x="182" y="96" fill="#edf3ef">“Nordic shuts down over Christmas — don’t order if it won’t arrive first.”</text>

    <path d="M152,114 h528" stroke="#1c2422" stroke-width="1"/>
    <text x="152" y="136" fill="#77837e">3</text>
    <text x="182" y="136" fill="#edf3ef">“Never propose more than 300 units of one product in a single order.”</text>
  </g>

  <line x1="416" y1="152" x2="416" y2="182" stroke="#77837e" stroke-width="1.4" marker-end="url(#slc-grey)"/>

  <!-- what reads them -->
  <rect x="236" y="186" width="360" height="68" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <g stroke="#42e2b7" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="388" y1="191" x2="388" y2="197"/>
    <circle cx="388" cy="189" r="1.6" fill="#42e2b7" stroke="none"/>
    <rect x="376" y="197" width="24" height="21" rx="5.5"/>
    <line x1="374" y1="204" x2="374" y2="211"/>
    <line x1="402" y1="204" x2="402" y2="211"/>
  </g>
  <circle cx="383" cy="205" r="2" fill="#42e2b7"/>
  <circle cx="393" cy="205" r="2" fill="#42e2b7"/>
  <line x1="383.5" y1="212" x2="392.5" y2="212" stroke="#42e2b7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="437" y="213" text-anchor="middle" font-size="11.5" font-weight="600" fill="#edf3ef">The AI</text>
  <text x="416" y="236" text-anchor="middle" font-size="10" fill="#a6b0ab">reads every rule, plus the stock and the sales history</text>

  <line x1="290" y1="254" x2="290" y2="292" stroke="#77837e" stroke-width="1.4" marker-end="url(#slc-grey)"/>
  <text x="300" y="278" font-size="9.5" fill="#77837e">on a schedule</text>
  <line x1="542" y1="254" x2="542" y2="292" stroke="#77837e" stroke-width="1.4" marker-end="url(#slc-grey)"/>
  <text x="532" y="278" text-anchor="end" font-size="9.5" fill="#77837e">when someone asks</text>

  <!-- what comes out -->
  <rect x="170" y="296" width="240" height="70" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="290" y="320" text-anchor="middle" font-size="11.5" font-weight="600" fill="#edf3ef">Warnings</text>
  <text x="290" y="340" text-anchor="middle" font-size="10" fill="#a6b0ab">“Hand soap: 2 days of cover left”</text>
  <text x="290" y="356" text-anchor="middle" font-size="9.5" fill="#77837e">a note for a person to read</text>

  <rect x="422" y="296" width="240" height="70" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="542" y="320" text-anchor="middle" font-size="11.5" font-weight="600" fill="#edf3ef">Draft orders</text>
  <text x="542" y="340" text-anchor="middle" font-size="10" fill="#a6b0ab">“96 L olive oil from Helvetia”</text>
  <text x="542" y="356" text-anchor="middle" font-size="9.5" fill="#f59e0b">nothing is ordered until someone accepts</text>

</svg>
