<svg viewBox="0 0 560 258" width="560" height="258" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <defs>
    <marker id="dep-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
  </defs>

  <rect width="560" height="258" fill="#0b0f10"/>

  <!-- api (the shared contract, at the apex) -->
  <rect x="210" y="28" width="140" height="58" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="280" y="53" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">api</text>
  <text x="280" y="71" text-anchor="middle" font-size="10" fill="#42e2b7">the contract</text>

  <!-- guest (untrusted) -->
  <rect x="44" y="182" width="150" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="119" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">guest</text>
  <text x="119" y="226" text-anchor="middle" font-size="10" fill="#ff736b">untrusted</text>

  <!-- runtime (trusted) -->
  <rect x="366" y="182" width="150" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="441" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#edf3ef">runtime</text>
  <text x="441" y="226" text-anchor="middle" font-size="10" fill="#77837e">trusted host</text>

  <!-- dependency arrows -->
  <line x1="140" y1="182" x2="236" y2="88" stroke="#77837e" stroke-width="1.5" marker-end="url(#dep-arr)"/>
  <line x1="420" y1="182" x2="324" y2="88" stroke="#77837e" stroke-width="1.5" marker-end="url(#dep-arr)"/>
  <line x1="194" y1="213" x2="364" y2="213" stroke="#77837e" stroke-width="1.5" marker-end="url(#dep-arr)"/>

  <text x="166" y="128" text-anchor="middle" font-size="11" fill="#a6b0ab">uses</text>
  <text x="392" y="128" text-anchor="middle" font-size="11" fill="#a6b0ab">implements</text>
  <text x="279" y="203" text-anchor="middle" font-size="11" fill="#a6b0ab">links</text>
</svg>
