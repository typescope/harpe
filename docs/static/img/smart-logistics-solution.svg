<svg viewBox="0 0 720 380" width="720" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sls-title sls-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="sls-title">The program is checked before it is allowed to run</title>
  <desc id="sls-desc">The AI writes a program in Jo. Harpe checks it against the list of permitted operations — read the stock, read the rules, propose a draft order. A program that names buying, approving or sending is rejected and never runs. A program that stays on the list is allowed to run, and it is the only part of the system the AI wrote: it reads and writes the depot, where every write is checked, and what it produces are draft orders and warnings for the depot manager, who accepts or rejects them. Until then nothing is ordered.</desc>

  <defs>
    <marker id="sls-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="sls-arr-back" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="sls-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f87171"/>
    </marker>
    <marker id="sls-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#42e2b7"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#0b0f10"/>

  <!-- the AI writes a program -->
  <rect x="34" y="40" width="136" height="62" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <g stroke="#42e2b7" stroke-width="1.3" fill="none" stroke-linecap="round">
    <line x1="56" y1="58" x2="56" y2="63"/>
    <circle cx="56" cy="56" r="1.4" fill="#42e2b7" stroke="none"/>
    <rect x="47" y="63" width="18" height="16" rx="4"/>
    <line x1="45" y1="68" x2="45" y2="73"/>
    <line x1="67" y1="68" x2="67" y2="73"/>
  </g>
  <circle cx="52" cy="69" r="1.5" fill="#42e2b7"/>
  <circle cx="60" cy="69" r="1.5" fill="#42e2b7"/>
  <line x1="52.5" y1="74.5" x2="59.5" y2="74.5" stroke="#42e2b7" stroke-width="1.3" stroke-linecap="round"/>
  <text x="80" y="65" font-size="11" font-weight="600" fill="#edf3ef">The AI</text>
  <text x="80" y="80" font-size="9.5" fill="#a6b0ab">writes a program</text>
  <text x="80" y="93" font-size="9.5" fill="#a6b0ab">in Jo</text>

  <line x1="170" y1="71" x2="206" y2="71" stroke="#77837e" stroke-width="1.4" marker-end="url(#sls-arr)"/>

  <!-- harpe checks it: a gate the program has to pass -->
  <path d="M210,71 L238,32 L402,32 L430,71 L402,110 L238,110 Z" fill="#101512" stroke="#42e2b7" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" font-weight="600" fill="#42e2b7">Harpe checks the program</text>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#a6b0ab">is every operation on the list?</text>
  <text x="320" y="94" text-anchor="middle" font-size="9.5" fill="#edf3ef">read stock · read rules · propose</text>

  <line x1="430" y1="71" x2="479" y2="71" stroke="#f87171" stroke-width="1.4" marker-end="url(#sls-red)"/>

  <!-- rejected -->
  <circle cx="498" cy="71" r="15" fill="none" stroke="#f87171" stroke-width="1.8"/>
  <g stroke="#f87171" stroke-width="2" stroke-linecap="round">
    <line x1="492" y1="65" x2="504" y2="77"/>
    <line x1="504" y1="65" x2="492" y2="77"/>
  </g>
  <text x="524" y="63" font-size="11.5" font-weight="600" fill="#f87171">Rejected</text>
  <text x="524" y="80" font-size="9.5" fill="#a6b0ab">it names buying, approving</text>
  <text x="524" y="94" font-size="9.5" fill="#a6b0ab">or sending — it never runs</text>

  <line x1="320" y1="110" x2="320" y2="182" stroke="#42e2b7" stroke-width="1.4" marker-end="url(#sls-green)"/>
  <text x="332" y="148" font-size="9.5" fill="#42e2b7">everything on the list — allowed to run</text>

  <!-- the depot the program reads from and writes to -->
  <path d="M16,206 v66 a44,9 0 0 0 88,0 v-66 z" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <ellipse cx="60" cy="206" rx="44" ry="9" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="60" y="242" text-anchor="middle" font-size="10.5" font-weight="600" fill="#edf3ef">The depot</text>
  <text x="60" y="300" text-anchor="middle" font-size="9.5" fill="#77837e">stock · rules · orders</text>
  <text x="60" y="314" text-anchor="middle" font-size="9.5" fill="#42e2b7">every write is checked</text>
  <line x1="108" y1="239" x2="214" y2="239" stroke="#77837e" stroke-width="1.4" marker-end="url(#sls-arr)" marker-start="url(#sls-arr-back)"/>

  <!-- the boundary of the AI-written program -->
  <rect x="218" y="172" width="204" height="130" rx="10" fill="none" stroke="#a6b0ab" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.8"/>
  <text x="422" y="166" text-anchor="end" font-size="9.5" fill="#a6b0ab">written by AI</text>

  <!-- it runs -->
  <rect x="230" y="190" width="180" height="98" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="248" y="214" font-size="11.5" font-weight="600" fill="#edf3ef">The program runs</text>
  <text x="248" y="236" font-size="10" fill="#a6b0ab">reads the stock, the rules</text>
  <text x="248" y="250" font-size="10" fill="#a6b0ab">and the sales history</text>
  <text x="248" y="272" font-size="10" fill="#edf3ef">proposes an order</text>

  <line x1="424" y1="239" x2="596" y2="239" stroke="#77837e" stroke-width="1.4" marker-end="url(#sls-arr)"/>
  <text x="440" y="230" font-size="10.5" fill="#edf3ef">draft orders · warnings</text>
  <text x="440" y="258" font-size="9.5" fill="#f59e0b">nothing is ordered until accepted</text>

  <!-- the person who decides -->
  <circle cx="634" cy="210" r="14" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <path d="M608,258 C608,231 660,231 660,258" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="634" y="278" text-anchor="middle" font-size="10.5" font-weight="600" fill="#edf3ef">Depot manager</text>
  <text x="634" y="294" text-anchor="middle" font-size="9.5" fill="#f59e0b">accepts or rejects</text>

  <line x1="20" y1="340" x2="700" y2="340" stroke="#1c2422" stroke-width="1"/>
  <text x="20" y="362" font-size="11" fill="#a6b0ab">The rules decide what gets proposed. Only the dashed box is written by AI — everything else is code you wrote.</text>
</svg>
