<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">An operator tells a robot cell its next job</title>
<desc id="desc">An operator standing outside a robot cell says: line up the red parts along the top edge, biggest on the left. The AI writes a program for it, and the program runs in the cell. The cell is an arm, its work table, a fence and a light curtain on the operator's side. The arm is placing red parts in a row on the table, biggest on the left.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#63766a"/></marker></defs>
<rect width="960" height="360" rx="16" fill="#f2f6f2"/>
<g font-family="system-ui,sans-serif" fill="#193d31">
<text x="32" y="42" font-size="21" font-weight="600">The operator says what they want. The AI writes the program.</text>

<rect x="28" y="72" width="220" height="92" rx="10" fill="white" stroke="#c5d5ca"/>
<path d="M70 163 L84 190 L96 163" fill="white" stroke="#c5d5ca"/>
<rect x="71" y="160" width="24" height="4" fill="white"/>
<g font-size="15" font-style="italic">
<text x="48" y="104">“Line up the red parts</text>
<text x="48" y="126">along the top edge,</text>
<text x="48" y="148">biggest on the left.”</text>
</g>
<circle cx="84" cy="212" r="16" fill="#63766a"/>
<rect x="64" y="234" width="40" height="86" rx="14" fill="#63766a"/>
<text x="84" y="344" font-size="13" fill="#63766a" text-anchor="middle">operator</text>

<line x1="250" y1="118" x2="296" y2="118" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="300" y="72" width="200" height="92" rx="10" fill="white" stroke="#9aafa0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="400" y="102" font-size="15" font-weight="600" text-anchor="middle">Program the AI wrote</text>
<g fill="#d5e0d8">
<rect x="322" y="116" width="130" height="8" rx="4"/>
<rect x="336" y="130" width="100" height="8" rx="4"/>
<rect x="336" y="144" width="140" height="8" rx="4"/>
</g>

<line x1="502" y1="118" x2="546" y2="118" stroke="#63766a" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="550" y="68" width="382" height="272" rx="10" fill="white" stroke="#c5d5ca"/>
<text x="570" y="98" font-size="17" font-weight="600">Robot cell</text>
<text x="570" y="118" font-size="12" fill="#63766a">arm, work table, fence and light curtain</text>

<g stroke="#af6945" stroke-width="2" stroke-dasharray="3 6">
<line x1="582" y1="170" x2="582" y2="320"/>
<line x1="590" y1="170" x2="590" y2="320"/>
</g>
<text x="570" y="160" font-size="12" fill="#9b4c2d">light curtain</text>

