<svg viewBox="0 0 760 348" width="760" height="348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gvs-title gvs-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="gvs-title">A general-purpose agent and a specialized agent, side by side</title>
  <desc id="gvs-desc">The same five systems appear in both panels as bubbles: database, REST APIs, files, shell and email. For a general-purpose agent every bubble is open, so all of every system is in reach. For a specialized agent three bubbles are masked out entirely, and the two that remain are open only over a small patch of themselves.</desc>

  <rect width="760" height="348" fill="#0b0f10"/>

  <!-- ================= general agent ================= -->
  <rect x="20" y="56" width="348" height="264" rx="12" fill="#0d1113" stroke="#293236" stroke-width="1.5"/>
  <text x="194" y="84" text-anchor="middle" font-size="13.5" font-weight="600" fill="#edf3ef">General-purpose agent</text>
  <text x="194" y="102" text-anchor="middle" font-size="10.5" fill="#f87171">broad authority</text>

  <!-- every bubble open: the whole of each system is in reach -->
  <g fill="#f87171" fill-opacity="0.22" stroke="#f87171" stroke-width="1.5">
    <circle cx="106" cy="170" r="42"/>
    <circle cx="212" cy="152" r="40"/>
    <circle cx="296" cy="190" r="26"/>
    <circle cx="124" cy="258" r="30"/>
    <circle cx="218" cy="244" r="28"/>
  </g>
  <g text-anchor="middle" fill="#edf3ef">
    <text x="106" y="174" font-size="11.5">database</text>
    <text x="212" y="160" font-size="11">REST APIs</text>
    <text x="296" y="194" font-size="9.5">files</text>
    <text x="124" y="262" font-size="10.5">shell</text>
    <text x="218" y="248" font-size="10">email</text>
  </g>

  <text x="194" y="308" text-anchor="middle" font-size="10.5" fill="#a6b0ab">All of every system is in reach.</text>

  <!-- ================= specialized agent ================= -->
  <rect x="392" y="56" width="348" height="264" rx="12" fill="#0d1113" stroke="#293236" stroke-width="1.5"/>
  <text x="566" y="84" text-anchor="middle" font-size="13.5" font-weight="600" fill="#edf3ef">Specialized agent</text>
  <text x="566" y="102" text-anchor="middle" font-size="10.5" fill="#42e2b7">least authority</text>

  <!-- masked out: not reachable, and not nameable either -->
  <g fill="#0b0f10" stroke="#1c2326" stroke-width="1.5" stroke-dasharray="3 3">
    <circle cx="668" cy="190" r="26"/>
    <circle cx="496" cy="258" r="30"/>
    <circle cx="590" cy="244" r="28"/>
  </g>
  <g text-anchor="middle" fill="#414a45">
    <text x="668" y="194" font-size="9.5">files</text>
    <text x="496" y="262" font-size="10.5">shell</text>
    <text x="590" y="248" font-size="10">email</text>
  </g>

  <!-- granted: the bubble stays masked except for one small patch of it -->
  <g fill="#0b0f10" stroke="#2f3d38" stroke-width="1.5">
    <circle cx="478" cy="170" r="42"/>
    <circle cx="584" cy="152" r="40"/>
  </g>
  <g fill="#42e2b7" fill-opacity="0.92">
    <path d="M484,146 C484,140 490,136 496,137 C503,138 508,143 507,149 C506,155 499,159 493,157 C487,155 484,151 484,146 Z"/>
    <path d="M586,133 C586,128 591,124 597,125 C603,126 607,131 605,137 C603,142 597,145 592,143 C588,141 586,137 586,133 Z"/>
  </g>
  <g text-anchor="middle" fill="#edf3ef">
    <text x="478" y="174" font-size="11.5">database</text>
    <text x="584" y="160" font-size="11">REST APIs</text>
  </g>

  <text x="566" y="308" text-anchor="middle" font-size="10.5" fill="#a6b0ab">Most systems are out of reach, and the rest only in part.</text>
</svg>
