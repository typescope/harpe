<svg viewBox="0 0 720 258" width="720" height="258" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fbi-title fbi-desc" style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <title id="fbi-title">Two repeatable calls and one that is not</title>
  <desc id="fbi-desc">Inside one generated program, searchFlights and getOffer can be repeated at will. createOrder takes a payment and issues a ticket against a passenger name, and there is no return path from that.</desc>

  <defs>
    <marker id="fbi-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="fbi-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#42e2b7"/>
    </marker>
    <marker id="fbi-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="720" height="258" fill="#0b0f10"/>

  <!-- repeat arc over the two cheap calls -->
  <path d="M64,74 C64,36 296,36 296,74" fill="none" stroke="#42e2b7" stroke-width="1.4" marker-end="url(#fbi-g)"/>
  <text x="180" y="30" text-anchor="middle" font-size="10.5" fill="#42e2b7">run again, as often as you like</text>

  <!-- the three capability calls -->
  <rect x="28" y="74" width="152" height="58" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="104" y="99" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#edf3ef">searchFlights</text>
  <text x="104" y="118" text-anchor="middle" font-size="10" fill="#77837e">reads</text>

  <rect x="204" y="74" width="124" height="58" rx="8" fill="#101512" stroke="#293236" stroke-width="1.5"/>
  <text x="266" y="99" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#edf3ef">getOffer</text>
  <text x="266" y="118" text-anchor="middle" font-size="10" fill="#77837e">reads</text>

  <rect x="352" y="74" width="146" height="58" rx="8" fill="#1a1410" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="425" y="99" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#edf3ef">createOrder</text>
  <text x="425" y="118" text-anchor="middle" font-size="10" fill="#f59e0b">acts</text>

  <!-- the effect -->
  <rect x="522" y="66" width="174" height="74" rx="8" fill="#160f10" stroke="#f87171" stroke-width="1.5"/>
  <text x="609" y="90" text-anchor="middle" font-size="11" fill="#f87171">payment taken</text>
  <text x="609" y="108" text-anchor="middle" font-size="11" fill="#f87171">ticket issued to a name</text>
  <text x="609" y="126" text-anchor="middle" font-size="11" fill="#f87171">airline's rules apply</text>

  <line x1="180" y1="103" x2="202" y2="103" stroke="#77837e" stroke-width="1.6" marker-end="url(#fbi-arr)"/>
  <line x1="328" y1="103" x2="350" y2="103" stroke="#77837e" stroke-width="1.6" marker-end="url(#fbi-arr)"/>
  <line x1="498" y1="103" x2="520" y2="103" stroke="#f87171" stroke-width="1.8" marker-end="url(#fbi-red)"/>

  <!-- no way back -->
  <path d="M609,140 V166 H425 V136" fill="none" stroke="#f87171" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#fbi-red)"/>
  <g stroke="#f87171" stroke-width="2">
    <line x1="509" y1="160" x2="521" y2="172"/>
    <line x1="521" y1="160" x2="509" y2="172"/>
  </g>
  <text x="470" y="188" text-anchor="middle" font-size="10.5" fill="#f87171">no undo — a support conversation, not a delete</text>

  <!-- caption -->
  <text x="360" y="222" text-anchor="middle" font-size="11.5" fill="#a6b0ab">All three are ordinary calls on one capability, reached from one program.</text>
  <text x="360" y="242" text-anchor="middle" font-size="11.5" fill="#a6b0ab">Nothing in the <tspan font-family="ui-monospace,monospace" fill="#edf3ef">type</tspan> of the third says it is the dangerous one.</text>
</svg>
