<svg viewBox="0 0 760 280" width="760" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The chat model calls runCode, a model-facing tool. runCode compiles a generated Jo program inside the guest boundary. The program uses typed capabilities granted by the application.">
  <defs>
    <marker id="tc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#77837e"/>
    </marker>
    <marker id="tc-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#42e2b7"/>
    </marker>
  </defs>

  <rect width="760" height="280" fill="#0b0f10"/>

  <text x="126" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#77837e">model-facing</text>
  <text x="541" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#77837e">compiled guest</text>

  <rect x="22" y="54" width="286" height="188" rx="12" fill="#0d1113" stroke="#293236" stroke-width="1.5"/>
  <rect x="336" y="54" width="402" height="188" rx="12" fill="#101512" stroke="#42e2b7" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="45" y="108" width="112" height="72" rx="8" fill="#151b18" stroke="#293236" stroke-width="1.5"/>
  <text x="101" y="139" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#edf3ef">chat model</text>
  <text x="101" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a6b0ab">chooses an action</text>

  <rect x="191" y="108" width="94" height="72" rx="8" fill="#151b18" stroke="#293236" stroke-width="1.5"/>
  <text x="238" y="137" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="600" fill="#42e2b7">runCode</text>
  <text x="238" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a6b0ab">Tool</text>

  <line x1="157" y1="144" x2="185" y2="144" stroke="#77837e" stroke-width="1.5" marker-end="url(#tc-arrow)"/>
  <text x="171" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#77837e">calls</text>

  <rect x="365" y="108" width="145" height="72" rx="8" fill="#151b18" stroke="#355248" stroke-width="1.5"/>
  <text x="437" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#edf3ef">generated Jo</text>
  <text x="437" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a6b0ab">typed program</text>

  <line x1="285" y1="144" x2="359" y2="144" stroke="#77837e" stroke-width="1.5" marker-end="url(#tc-arrow)"/>
  <text x="322" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#77837e">compiles</text>

  <rect x="563" y="92" width="145" height="104" rx="8" fill="#10201b" stroke="#42e2b7" stroke-width="1.5"/>
  <text x="635" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#edf3ef">typed</text>
  <text x="635" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#edf3ef">capabilities</text>
  <text x="635" y="174" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#6ed17f">fs · pdfReader · …</text>

  <line x1="510" y1="144" x2="557" y2="144" stroke="#42e2b7" stroke-width="1.8" marker-end="url(#tc-arrow-green)"/>
  <text x="533" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6ed17f">uses</text>

  <text x="537" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#77837e">authority checked before execution</text>
</svg>
