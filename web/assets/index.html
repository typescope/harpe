<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="doctitle">Harpe</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1c2024;
      --muted: #8a9099;
      --line: #e6e8eb;
      --user: #2f6df6;
      --agent: #f1f3f5;
      --accent: #2f6df6;
      --error: #c0392b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); background: var(--bg);
      display: flex; flex-direction: row; height: 100vh;
    }
    #sidebar {
      width: 256px; flex: none; background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 14px; padding: 16px 8px;
    }
    body.collapsed #sidebar { display: none; }
    /* Rows (brand, new chat, section labels, sessions) share one 16px content edge
       (8px sidebar padding + 8px per-row padding); the row padding lets the hover
       pills sit inset while every item's text/icon lines up in a single column. */
    .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
    .brand .agent-name {
      font-weight: 650; font-size: 16px; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand .icon-btn { margin-left: auto; flex: none; }
    .powered {
      flex: none; padding: 10px 8px 0; border-top: 1px solid var(--line);
      font-size: 11px; color: var(--muted);
    }
    .powered .mark {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700; letter-spacing: 1px;
    }
    .panel-section {
      margin-top: 2px; padding: 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .5px; color: var(--muted);
    }
    .newchat {
      display: flex; align-items: center; gap: 9px;
      border: none; background: transparent; color: var(--ink);
      font: inherit; font-weight: 600; padding: 9px 8px; border-radius: 10px;
      cursor: pointer; text-align: left;
    }
    .newchat:hover { background: var(--agent); }
    .newchat svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
    .sessions { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .session-item {
      padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px;
    }
    .session-item:hover { background: var(--agent); }
    .session-item.active { background: var(--agent); font-weight: 600; }
    .icon-btn {
      width: 32px; height: 32px; display: grid; place-items: center; padding: 0;
      border: none; background: transparent; color: var(--muted);
      border-radius: 8px; cursor: pointer;
    }
    .icon-btn:hover { background: var(--agent); color: var(--ink); }
    .icon-btn svg { width: 18px; height: 18px; display: block; }
    .opener {
      position: fixed; top: 12px; left: 12px; z-index: 5; display: none;
      background: var(--panel); border: 1px solid var(--line);
    }
    body.collapsed .opener { display: grid; }
    .chat { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
    main {
      flex: 1; overflow-y: auto; padding: 24px 0;
    }
    #messages { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .msg { display: flex; margin: 14px 0; }
    .msg.user { justify-content: flex-end; }
    .row { max-width: 80%; }
    .bubble {
      padding: 10px 14px; border-radius: 14px; word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .msg.user .bubble {
      background: var(--user); color: #fff; border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .msg.agent .bubble { background: var(--agent); color: var(--ink); border-bottom-left-radius: 4px; }
    .bubble.error { background: #fdecea; color: var(--error); white-space: pre-wrap; }
    /* rendered markdown inside agent bubbles */
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble p { margin: 0 0 8px; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 12px 0 6px; line-height: 1.3; }
    .bubble h1 { font-size: 1.3em; }
    .bubble h2 { font-size: 1.18em; }
    .bubble h3 { font-size: 1.05em; }
    .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
    .bubble li { margin: 2px 0; }
    .bubble blockquote {
      margin: 8px 0; padding-left: 12px;
      border-left: 3px solid var(--line); color: var(--muted);
    }
    .bubble a { color: var(--accent); }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
      background: rgba(20, 30, 50, .07); padding: 1px 5px; border-radius: 5px;
    }
    .bubble pre {
      background: #0d1117; color: #e6edf3; padding: 12px 14px;
      border-radius: 8px; overflow-x: auto; margin: 8px 0;
    }
    .bubble pre code {
      background: none; color: inherit; padding: 0; white-space: pre;
    }
    .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
    .bubble th, .bubble td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; }
    .bubble th { background: rgba(20, 30, 50, .04); font-weight: 600; }
    .status {
      font-size: 12px; color: var(--muted); margin: 6px 2px 0;
      display: flex; align-items: center; gap: 6px;
    }
    .status .dot, .loading .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }
    .loading {
      max-width: 760px; margin: 16vh auto 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--muted);
    }
    textarea:disabled { opacity: .5; }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .bubble.notice { color: var(--muted); font-style: italic; }
    .empty {
      max-width: 760px; margin: 16vh auto 0; padding: 0 20px;
      text-align: center; color: var(--muted);
    }
    footer { background: var(--bg); padding: 12px 20px 18px; }
    .composer {
      max-width: 760px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 26px; padding: 7px;
      box-shadow: 0 1px 3px rgba(20, 30, 50, .06);
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 109, 246, .14);
    }
    textarea {
      flex: 1; resize: none; border: none; outline: none; background: transparent;
      font: inherit; line-height: 1.5; padding: 8px 0; max-height: 180px;
      color: var(--ink);
    }
    #send {
      flex: none; width: 38px; height: 38px; padding: 0;
      display: grid; place-items: center;
      border: none; border-radius: 50%; background: var(--accent);
      color: #fff; cursor: pointer; transition: background .15s, opacity .15s;
    }
    #send:hover:not(:disabled) { background: #2256d6; }
    #send:disabled { opacity: .35; cursor: default; }
    #send svg { width: 19px; height: 19px; display: block; }
    #send.stop { background: var(--error); }
    #send.stop:hover { background: #a93226; }
    #send.stop svg { display: none; }
    #send.stop::before {
      content: ''; width: 12px; height: 12px; border-radius: 2px; background: #fff;
    }
    .hint { max-width: 760px; margin: 8px auto 0; color: var(--muted); font-size: 12px; text-align: center; }

    /* composer icon buttons (attach, files) */
    .cbtn {
      position: relative;
      flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center;
      border: none; background: transparent; color: var(--muted);
      border-radius: 50%; cursor: pointer; transition: background .15s, color .15s;
    }
    .cbtn:hover { background: var(--agent); color: var(--ink); }
    .cbtn.on { color: var(--accent); }
    .cbtn svg { width: 20px; height: 20px; display: block; }
    .cbtn .badge {
      position: absolute; top: -1px; right: -1px;
      min-width: 15px; height: 15px; padding: 0 3px; box-sizing: border-box;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      line-height: 15px; text-align: center; border-radius: 8px;
      border: 1.5px solid var(--panel);
    }

    /* pending attachments (before send) */
    .pending { max-width: 760px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: flex; align-items: center; gap: 6px; max-width: 220px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 5px 9px; font-size: 13px;
    }
    .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .x { flex: none; cursor: pointer; color: var(--muted); line-height: 1; font-size: 15px; }
    .chip .x:hover { color: var(--error); }

    /* attachment cards inside a message bubble */
    .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .msg.user .attachments { justify-content: flex-end; }
    .file-card {
      display: flex; align-items: center; gap: 9px; max-width: 240px;
      text-decoration: none; color: var(--ink);
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 11px;
    }
    .file-card:hover { border-color: var(--accent); }
    .file-card svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
    .file-card .file-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
    .file-card .file-size { font-size: 11px; color: var(--muted); }

    /* runCode trace — the programs the agent ran, folded under its reply */
    .trace { margin-top: 8px; }
    .trace > summary {
      list-style: none; cursor: pointer; user-select: none;
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 12.5px; padding: 3px 8px; border-radius: 8px;
    }
    .trace > summary::-webkit-details-marker { display: none; }
    .trace > summary:hover { background: var(--agent); color: var(--ink); }
    .trace > summary svg { width: 14px; height: 14px; flex: none; }
    .trace > summary .chev { transition: transform .15s; }
    .trace[open] > summary .chev { transform: rotate(90deg); }
    .trace-step { margin: 8px 0 0; }
    .trace-step .lbl {
      font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
      color: var(--muted); margin: 8px 0 3px;
    }
    .trace-code { position: relative; }
    .trace-code pre {
      margin: 0; background: #0d1117; color: #e6edf3; padding: 10px 12px;
      border-radius: 8px; overflow-x: auto; white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5;
    }
    .trace-out {
      margin: 0; background: rgba(20, 30, 50, .05); color: var(--ink);
      padding: 8px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5;
    }
    .trace-copy {
      position: absolute; top: 6px; right: 6px; border: none; cursor: pointer;
      background: rgba(255, 255, 255, .12); color: #e6edf3; font-size: 11px;
      padding: 2px 8px; border-radius: 6px;
    }
    .trace-copy:hover { background: rgba(255, 255, 255, .24); }

    /* drag-over hint on the chat area */
    body.dragging .chat { outline: 2px dashed var(--accent); outline-offset: -8px; }

    /* session files panel (right rail, default hidden) */
    #files-panel {
      width: 300px; flex: none; background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    body:not(.files-open) #files-panel { display: none; }
    #files-panel .panel-head {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 16px; border-bottom: 1px solid var(--line);
    }
    #files-panel .panel-head .ttl {
      font-weight: 650; font-size: 15px; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #files-panel .panel-head .icon-btn { margin-left: auto; flex: none; }
    #files-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
    #files-list .frow {
      display: flex; align-items: center; gap: 9px; padding: 8px 6px;
      border-radius: 8px; text-decoration: none; color: var(--ink);
    }
    #files-list .frow:hover { background: var(--agent); }
    #files-list .frow svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
    #files-list .frow .file-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #files-list .frow .file-size { font-size: 11px; color: var(--muted); margin-left: auto; flex: none; }
    #files-list .empty-files { color: var(--muted); font-size: 13px; padding: 8px 6px; }

    /* narrow viewports: the panel overlays the chat instead of taking a column */
    @media (max-width: 1000px) {
      body.files-open #files-panel {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 10;
        box-shadow: -4px 0 20px rgba(20, 30, 50, .14);
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="agent-name" id="title">Agent</span>
      <button id="collapse" class="icon-btn" aria-label="Collapse panel" title="Collapse panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    <button id="newchat" class="newchat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"></path></svg>
      New chat
    </button>
    <div class="panel-section">Recent</div>
    <div id="sessions" class="sessions"></div>
    <div class="powered">Powered by <span class="mark">HARPE</span></div>
  </aside>
  <button id="opener" class="icon-btn opener" aria-label="Open panel" title="Open panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <div class="chat">
    <main>
      <div id="empty" class="empty">Start the conversation &mdash; ask the agent anything.</div>
      <div id="loading" class="loading" style="display: none"><span class="dot"></span>Loading conversation&hellip;</div>
      <div id="messages"></div>
    </main>
    <footer>
      <div id="pending" class="pending" style="display: none"></div>
      <div class="composer">
        <button id="files-toggle" class="cbtn" aria-label="Session files" title="Session files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </button>
        <button id="attach" class="cbtn" aria-label="Attach files" title="Attach files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"></path></svg>
        </button>
        <input id="file-input" type="file" multiple style="display: none">
        <textarea id="input" rows="1" placeholder="Message the agent..."></textarea>
        <button id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
      <div class="hint">Enter to send, Shift+Enter for a new line. Attach files with the clip, or drag them in.</div>
    </footer>
  </div>
  <aside id="files-panel">
    <div class="panel-head">
      <span class="ttl">Session files</span>
      <button id="files-close" class="icon-btn" aria-label="Close files" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="files-list"></div>
  </aside>

  <script>
    var msgs = document.getElementById('messages');
    var input = document.getElementById('input');
    var sendBtn = document.getElementById('send');
    var fileInput = document.getElementById('file-input');
    var attachBtn = document.getElementById('attach');
    var filesToggle = document.getElementById('files-toggle');
    var filesClose = document.getElementById('files-close');
    var filesPanel = document.getElementById('files-panel');
    var filesList = document.getElementById('files-list');
    var pendingBar = document.getElementById('pending');
    var NL = String.fromCharCode(10);
    var busy = false;
    var currentSession = null;
    var sessionList = [];
    var pending = [];   // File objects staged for the next message (not yet uploaded)

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // Markdown via markdown-it (loaded from CDN in <head>). Default options
    // keep html:false, so raw HTML in the model's reply is escaped, not run
    // (XSS-safe without a separate sanitizer). Returns null if the library
    // failed to load (e.g. offline), so the caller can fall back to plain text.
    var md = (typeof markdownit !== 'undefined')
      ? markdownit({ linkify: true, breaks: true })
      : null;

    function renderMarkdown(src) {
      return md ? md.render(src) : null;
    }

    function addMessage(role, text) {
      var empty = document.getElementById('empty');
      if (empty) empty.style.display = 'none';
      var wrap = el('div', 'msg ' + role);
      var row = el('div', 'row');
      var bubble = el('div', 'bubble', text);
      row.appendChild(bubble);
      wrap.appendChild(row);
      msgs.appendChild(wrap);
      scrollDown();
      return row;
    }

    function scrollDown() {
      var main = document.querySelector('main');
      main.scrollTop = main.scrollHeight;
    }

    // --- attachments ---

    var SVG = 'http://www.w3.org/2000/svg';

    function svgIcon(paths, extra) {
      var s = document.createElementNS(SVG, 'svg');
      s.setAttribute('viewBox', '0 0 24 24');
      s.setAttribute('fill', 'none');
      s.setAttribute('stroke', 'currentColor');
      s.setAttribute('stroke-width', '2');
      s.setAttribute('stroke-linecap', 'round');
      s.setAttribute('stroke-linejoin', 'round');
      paths.forEach(function (d) {
        var p = document.createElementNS(SVG, 'path');
        p.setAttribute('d', d);
        s.appendChild(p);
      });
      (extra || []).forEach(function (e) { s.appendChild(e); });
      return s;
    }

    // Classify a file into a coarse kind from its MIME type, falling back to the
    // filename extension (uploads may arrive with an empty or generic MIME).
    function fileKind(mime, name) {
      var m = (mime || '').toLowerCase();
      var ext = (name || '').toLowerCase().split('.').pop();
      if (m.indexOf('image/') === 0 || /^(png|jpe?g|gif|webp|svg|bmp|heic|tiff?)$/.test(ext)) return 'image';
      if (m.indexOf('pdf') >= 0 || ext === 'pdf') return 'pdf';
      if (m.indexOf('word') >= 0 || m.indexOf('wordprocessing') >= 0 || ext === 'doc' || ext === 'docx') return 'word';
      if (m.indexOf('excel') >= 0 || m.indexOf('spreadsheet') >= 0 || ext === 'xls' || ext === 'xlsx' || ext === 'csv') return 'excel';
      return 'file';
    }

    // A document-page glyph (folded corner) with an optional format label baked in
    // and a type color; `currentColor` drives both the outline and the label.
    function docGlyph(label, color) {
      var svg = svgIcon(['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6']);
      if (label) {
        var t = document.createElementNS(SVG, 'text');
        t.setAttribute('x', '12'); t.setAttribute('y', '17');
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '6'); t.setAttribute('font-weight', '700');
        t.setAttribute('fill', 'currentColor'); t.setAttribute('stroke', 'none');
        t.textContent = label;
        svg.appendChild(t);
      }
      if (color) svg.style.color = color;
      return svg;
    }

    // A per-format icon: a distinct picture glyph for images; a colored, labeled
    // page for PDF/Word/Excel; a plain page for anything else.
    var FILE_COLORS = { pdf: '#e5484d', word: '#2b6cb0', excel: '#2f855a' };
    var FILE_LABELS = { pdf: 'PDF', word: 'DOC', excel: 'XLS' };

    function fileIcon(mime, name) {
      var kind = fileKind(mime, name);
      if (kind === 'image') {
        var circle = document.createElementNS(SVG, 'circle');
        circle.setAttribute('cx', '9'); circle.setAttribute('cy', '9'); circle.setAttribute('r', '2');
        var img = svgIcon(['M21 15l-5-5L5 21'], [rect('3', '3', '18', '18', '2'), circle]);
        img.style.color = '#8257e6';
        return img;
      }
      return docGlyph(FILE_LABELS[kind] || null, FILE_COLORS[kind] || null);
    }

    function rect(x, y, w, h, r) {
      var e = document.createElementNS(SVG, 'rect');
      e.setAttribute('x', x); e.setAttribute('y', y);
      e.setAttribute('width', w); e.setAttribute('height', h); e.setAttribute('rx', r);
      return e;
    }

    function humanSize(n) {
      if (!n && n !== 0) return '';
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      return (n / 1048576).toFixed(1) + ' MB';
    }

    // A clickable card for one attachment. When a session is known the card links
    // to the file (inline-served, so images/PDFs preview in a new tab).
    function fileCard(att, session) {
      var card = el('a', 'file-card');
      if (session) {
        card.href = '/api/file?session=' + encodeURIComponent(session) + '&name=' + encodeURIComponent(att.name);
        card.target = '_blank';
        card.rel = 'noopener';
      }
      card.appendChild(fileIcon(att.mime, att.name));
      var meta = el('div');
      meta.appendChild(el('div', 'file-name', att.name));
      var sz = humanSize(att.size);
      if (sz) meta.appendChild(el('div', 'file-size', sz));
      card.appendChild(meta);
      return card;
    }

    function appendAttachments(row, atts, session) {
      if (!atts || !atts.length) return;
      var wrap = el('div', 'attachments');
      atts.forEach(function (a) { wrap.appendChild(fileCard(a, session)); });
      row.appendChild(wrap);
    }

    // The runCode trace under an agent reply: a collapsed "Ran N programs"
    // disclosure that expands to each Jo program (copyable) and its output. The
    // programs and output come straight from the transcript, so it survives reload.
    function codeTrace(steps) {
      var d = el('details', 'trace');
      var sum = el('summary');
      var chev = svgIcon(['M9 18l6-6-6-6']); chev.setAttribute('class', 'chev');
      sum.appendChild(chev);
      sum.appendChild(el('span', null, 'Ran ' + steps.length + (steps.length === 1 ? ' program' : ' programs')));
      d.appendChild(sum);

      steps.forEach(function (st, i) {
        var step = el('div', 'trace-step');
        if (steps.length > 1) step.appendChild(el('div', 'lbl', 'Program ' + (i + 1)));

        var codeWrap = el('div', 'trace-code');
        var pre = el('pre'); pre.textContent = st.code;
        var copy = el('button', 'trace-copy', 'Copy');
        copy.addEventListener('click', function () {
          if (navigator.clipboard) navigator.clipboard.writeText(st.code);
          copy.textContent = 'Copied';
          setTimeout(function () { copy.textContent = 'Copy'; }, 1200);
        });
        codeWrap.appendChild(pre);
        codeWrap.appendChild(copy);
        step.appendChild(codeWrap);

        if (st.output) {
          step.appendChild(el('div', 'lbl', 'Output'));
          var out = el('pre', 'trace-out'); out.textContent = st.output;
          step.appendChild(out);
        }
        d.appendChild(step);
      });
      return d;
    }

    // --- pending (staged) files ---

    function addFiles(fileList) {
      for (var i = 0; i < fileList.length; i++) pending.push(fileList[i]);
      renderPending();
    }

    function removePending(idx) {
      pending.splice(idx, 1);
      renderPending();
    }

    function renderPending() {
      pendingBar.innerHTML = '';
      pendingBar.style.display = pending.length ? 'flex' : 'none';
      pending.forEach(function (f, i) {
        var chip = el('div', 'chip');
        chip.appendChild(el('span', 'nm', f.name));
        var x = el('span', 'x', '×');
        x.title = 'Remove';
        x.addEventListener('click', function () { removePending(i); });
        chip.appendChild(x);
        pendingBar.appendChild(chip);
      });
    }

    // Read one File as base64 and POST it to /api/upload. Resolves to the stored
    // file's metadata {session, name, size, mime}; the first upload of a new chat
    // mints the session, which the caller adopts for the message that follows.
    function uploadOne(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('read failed')); };
        reader.onload = function () {
          var b64 = String(reader.result).split(',')[1] || '';
          fetch('/api/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session: currentSession || '', name: file.name, mime: file.type, data: b64 })
          }).then(function (r) { return r.json(); }).then(resolve).catch(reject);
        };
        reader.readAsDataURL(file);
      });
    }

    // Upload staged files in order, adopting the session id the server returns.
    function uploadAll(files) {
      var out = [];
      var chain = Promise.resolve();
      files.forEach(function (f) {
        chain = chain.then(function () {
          return uploadOne(f).then(function (meta) {
            if (meta.error) throw new Error(meta.error);
            if (meta.session && meta.session !== currentSession) {
              currentSession = meta.session;
              history.replaceState({}, '', '/c/' + currentSession);
            }
            out.push({ name: meta.name, size: meta.size, mime: meta.mime });
          });
        });
      });
      return chain.then(function () { return out; });
    }

    // --- session files panel (right rail) ---

    function isWide() { return window.innerWidth > 1000; }

    function setFilesOpen(on) {
      document.body.classList.toggle('files-open', on);
      filesToggle.classList.toggle('on', on);
    }

    function toggleFilesPanel() {
      var open = !document.body.classList.contains('files-open');
      setFilesOpen(open);
      if (open) refreshFiles(false);
    }

    // Count badge on the folder toggle, so files are discoverable while the panel
    // is closed (and it stays empty/absent for a session with no files).
    function setFilesBadge(n) {
      var b = filesToggle.querySelector('.badge');
      if (!n) { if (b) b.remove(); return; }
      if (!b) { b = el('span', 'badge'); filesToggle.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
    }

    function renderFiles(files) {
      filesList.innerHTML = '';
      if (!files.length) {
        filesList.innerHTML = '<div class="empty-files">No files in this session yet.</div>';
        return;
      }
      files.forEach(function (f) {
        var a = el('a', 'frow');
        a.href = '/api/file?session=' + encodeURIComponent(currentSession) + '&name=' + encodeURIComponent(f.name);
        a.target = '_blank';
        a.rel = 'noopener';
        a.appendChild(fileIcon(f.mime, f.name));
        a.appendChild(el('span', 'file-name', f.name));
        a.appendChild(el('span', 'file-size', humanSize(f.size)));
        filesList.appendChild(a);
      });
    }

    // Fetch the session's files, refresh the list + badge, and — when `autoOpen`
    // (a session load) — open the panel on a wide screen if there are files to show.
    function refreshFiles(autoOpen) {
      if (!currentSession) {
        renderFiles([]);
        setFilesBadge(0);
        if (autoOpen) setFilesOpen(false);
        return;
      }
      fetch('/api/files?session=' + encodeURIComponent(currentSession))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var files = d.files || [];
          renderFiles(files);
          setFilesBadge(files.length);
          if (autoOpen) setFilesOpen(files.length > 0 && isWide());
        }).catch(function () {
          filesList.innerHTML = '<div class="empty-files">Could not load files.</div>';
        });
    }

    function loadInfo() {
      fetch('/api/info').then(function (r) { return r.json(); }).then(function (d) {
        document.getElementById('title').textContent = d.name;
        document.getElementById('doctitle').textContent = d.name;
      }).catch(function () {});
    }

    // --- sessions: URL <-> conversation ---

    function appendMessage(role, text, attachments, steps) {
      var row = addMessage(role, '');
      var bubble = row.querySelector('.bubble');
      if (role === 'agent') {
        var html = renderMarkdown(text);
        if (html === null) bubble.textContent = text; else bubble.innerHTML = html;
      } else {
        bubble.textContent = text;
        if (!text) bubble.style.display = 'none';
      }
      appendAttachments(row, attachments, currentSession);
      if (role === 'agent' && steps && steps.length) row.appendChild(codeTrace(steps));
      return row;
    }

    function showEmpty(on) {
      var empty = document.getElementById('empty');
      if (empty) empty.style.display = on ? '' : 'none';
    }

    function clearMessages() {
      msgs.innerHTML = '';
      showEmpty(true);
    }

    function sessionFromPath() {
      var m = location.pathname.match(/^\/c\/(.+)$/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    function renderSessions() {
      var c = document.getElementById('sessions');
      c.innerHTML = '';
      sessionList.forEach(function (s) {
        var item = el('div', 'session-item' + (s.id === currentSession ? ' active' : ''), s.title || 'New chat');
        item.title = s.title || '';
        item.addEventListener('click', function () { openSession(s.id); });
        c.appendChild(item);
      });
    }

    function loadSessions() {
      fetch('/api/sessions').then(function (r) { return r.json(); }).then(function (d) {
        sessionList = d.sessions || [];
        renderSessions();
      }).catch(function () {});
    }

    // While a conversation loads, a centered indicator replaces the transcript
    // and the composer is disabled, so a half-loaded session can't be typed
    // into. `loadSeq` makes the latest load win if sessions are switched fast.
    var loadSeq = 0;

    function setLoading(on) {
      document.getElementById('loading').style.display = on ? '' : 'none';
      input.disabled = on;
      sendBtn.disabled = on;
    }

    // `quiet` re-renders in place from the transcript without the loading spinner
    // or a blank flash — used to fold in a just-finished turn's code trace.
    function loadHistory(id, quiet) {
      var seq = ++loadSeq;
      if (!quiet) { msgs.innerHTML = ''; showEmpty(false); setLoading(true); }

      return fetch('/api/history?session=' + encodeURIComponent(id))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (seq !== loadSeq) return;
          setLoading(false);
          msgs.innerHTML = '';
          var list = d.messages || [];
          var active = d.state && d.state.active;
          if (list.length === 0 && !active) { showEmpty(true); }
          else { showEmpty(false); list.forEach(function (m) { appendMessage(m.role, m.text, m.attachments, m.steps); }); }
          // A turn is still running on the server — reconnect and follow it live.
          if (active) reconnect(id, d.state, seq);
          scrollDown();
          input.focus();
        }).catch(function () {
          if (seq !== loadSeq) return;
          setLoading(false);
          if (!quiet) showEmpty(true);
        });
    }

    function openSession(id) {
      if (id === currentSession) return;
      currentSession = id;
      history.pushState({}, '', '/c/' + id);
      renderSessions();
      loadHistory(id);
      refreshFiles(true);
    }

    function newChat() {
      loadSeq++;          // abandon any in-flight history load
      setLoading(false);
      currentSession = null;
      history.pushState({}, '', '/');
      clearMessages();
      renderSessions();
      pending = [];
      renderPending();
      setFilesOpen(false);
      setFilesBadge(0);
      renderFiles([]);
      input.focus();
    }

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }

    function clearBusy() {
      busy = false;
      sendBtn.classList.remove('stop');
      sendBtn.setAttribute('aria-label', 'Send');
    }

    function send() {
      if (busy || input.disabled) return;
      var text = input.value.trim();
      var files = pending.slice();
      if (!text && !files.length) return;
      input.value = '';
      autoGrow();
      pending = [];
      renderPending();

      // The user turn: text bubble (hidden if empty) plus a card per staged file.
      // Cards get their download link once the session is known (below).
      var urow = addMessage('user', text);
      if (!text) urow.querySelector('.bubble').style.display = 'none';
      var localAtts = files.map(function (f) { return { name: f.name, size: f.size, mime: f.type }; });
      appendAttachments(urow, localAtts, currentSession);

      busy = true;
      sendBtn.classList.add('stop');
      sendBtn.setAttribute('aria-label', 'Stop');

      var row = addMessage('agent', '');
      var bubble = row.querySelector('.bubble');
      var status = el('div', 'status');
      status.appendChild(el('span', 'dot'));
      var statusText = el('span', null, files.length ? 'uploading' : 'thinking');
      status.appendChild(statusText);
      row.appendChild(status);
      scrollDown();

      function finish() {
        status.remove();
        clearBusy();
        input.focus();
        loadSessions();
        refreshFiles(false);   // update the list + badge; don't change open state
        // Re-render this turn from the transcript so its code trace folds in.
        if (currentSession) loadHistory(currentSession, true); else scrollDown();
      }

      uploadAll(files).then(function (uploaded) {
        // Re-render the user's cards now that the session (and any de-duplicated
        // server-side names) are known, so each card links to its stored file.
        if (uploaded.length) {
          var old = urow.querySelector('.attachments');
          if (old) old.remove();
          appendAttachments(urow, uploaded, currentSession);
        }
        statusText.textContent = 'thinking';
        return streamTurn(text, uploaded, bubble, statusText, finish);
      }).catch(function () {
        statusText.textContent = 'upload failed';
        clearBusy();
      });
    }

    // Drain one NDJSON event stream, dispatching each line through handle() into
    // `bubble`/`statusText`; calls onDone() when the stream ends. Shared by the
    // send path (POST /api/message) and the reconnect path (GET /api/subscribe).
    function readStream(resp, bubble, statusText, onDone) {
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) { onDone(); return; }
          buf += decoder.decode(res.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf(NL)) >= 0) {
            var line = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if (line) handle(JSON.parse(line), bubble, statusText);
          }
          return pump();
        });
      }
      return pump();
    }

    // POST one message and render its progress/answer stream into `bubble`.
    function streamTurn(text, attachments, bubble, statusText, finish) {
      var body = { text: text, attachments: attachments || [] };
      if (currentSession) body.session = currentSession;

      return fetch('/api/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (resp) {
        return readStream(resp, bubble, statusText, finish);
      }).catch(function () {
        statusText.textContent = 'connection error';
        clearBusy();
      });
    }

    // Reconnect to a turn already running on the server (e.g. after a page refresh,
    // or in a second tab opened mid-turn). The pending user message isn't in the
    // committed history yet, so it is rendered from the live `state`; then we follow
    // the turn's events until it ends, and reload the (now-committed) history.
    function reconnect(id, state, seq) {
      appendMessage('user', state.text || '', state.attachments);

      busy = true;
      sendBtn.classList.add('stop');
      sendBtn.setAttribute('aria-label', 'Stop');

      var row = addMessage('agent', '');
      var bubble = row.querySelector('.bubble');
      var status = el('div', 'status');
      status.appendChild(el('span', 'dot'));
      var statusText = el('span', null, 'working');
      status.appendChild(statusText);
      row.appendChild(status);
      scrollDown();

      function finish() {
        status.remove();
        clearBusy();
        // Render the committed result (with its code trace, or drop a turn that ended
        // interrupted); if the user navigated elsewhere meanwhile, leave their view.
        if (seq === loadSeq) loadHistory(id, true);
        loadSessions();
        refreshFiles(false);   // a reconnected turn may have produced files
      }

      fetch('/api/subscribe?session=' + encodeURIComponent(id))
        .then(function (resp) { return readStream(resp, bubble, statusText, finish); })
        .catch(function () { status.remove(); clearBusy(); });
    }

    // Progress is transient: while the turn runs, the pulsing dot plus one
    // line of small text show the latest step (thinking / tool summaries);
    // it all disappears when the turn's result arrives (finish() removes the
    // status element). Only the result lands in the transcript.
    function handle(ev, bubble, statusText) {
      if (ev.type === 'session') {
        currentSession = ev.id;
        history.pushState({}, '', '/c/' + ev.id);
      } else if (ev.type === 'status') {
        statusText.textContent = ev.label;
      } else if (ev.type === 'tool') {
        statusText.textContent = ev.summary;
      } else if (ev.type === 'answer') {
        var html = renderMarkdown(ev.text);
        if (html === null) bubble.textContent = ev.text;
        else bubble.innerHTML = html;
      } else if (ev.type === 'error') {
        bubble.classList.add('error');
        bubble.textContent = ev.detail;
      } else if (ev.type === 'interrupted') {
        bubble.classList.add('notice');
        bubble.textContent = 'Stopped.';
      } else if (ev.type === 'failed') {
        bubble.classList.add('error');
        bubble.textContent = 'request failed';
      }
      scrollDown();
    }

    // While a turn runs, the send button becomes a stop button: it asks the
    // server to cancel the session's turn (takes effect at the next model/tool
    // boundary; the stream then ends with an "interrupted" event).
    function stopTurn() {
      if (!currentSession) return;
      fetch('/api/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: currentSession })
      });
    }

    sendBtn.addEventListener('click', function () {
      if (busy) stopTurn(); else send();
    });
    input.addEventListener('input', autoGrow);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    document.getElementById('collapse').addEventListener('click', function () {
      document.body.classList.add('collapsed');
    });
    document.getElementById('opener').addEventListener('click', function () {
      document.body.classList.remove('collapsed');
    });
    document.getElementById('newchat').addEventListener('click', newChat);

    // Attach files: the clip opens the picker; chosen files are staged, not sent.
    attachBtn.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
      fileInput.value = '';   // let the same file be re-picked later
    });

    // Drag-and-drop anywhere over the chat pane stages the files.
    var chat = document.querySelector('.chat');
    ['dragenter', 'dragover'].forEach(function (ev) {
      chat.addEventListener(ev, function (e) {
        if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) {
          e.preventDefault();
          document.body.classList.add('dragging');
        }
      });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      chat.addEventListener(ev, function (e) {
        if (ev === 'dragleave' && e.relatedTarget && chat.contains(e.relatedTarget)) return;
        document.body.classList.remove('dragging');
      });
    });
    chat.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        e.preventDefault();
        addFiles(e.dataTransfer.files);
      }
    });

    // Paste an image (e.g. a screenshot) straight into the composer.
    input.addEventListener('paste', function (e) {
      var items = (e.clipboardData || {}).items || [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') { var f = items[i].getAsFile(); if (f) files.push(f); }
      }
      if (files.length) { e.preventDefault(); addFiles(files); }
    });

    filesToggle.addEventListener('click', toggleFilesPanel);
    filesClose.addEventListener('click', function () { setFilesOpen(false); });

    window.addEventListener('popstate', function () {
      currentSession = sessionFromPath();
      renderSessions();
      if (currentSession) loadHistory(currentSession); else clearMessages();
      refreshFiles(true);
    });

    currentSession = sessionFromPath();
    loadInfo();
    loadSessions();
    if (currentSession) { loadHistory(currentSession); refreshFiles(true); }
    input.focus();
  </script>
</body>
</html>
