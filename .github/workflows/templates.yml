name: Templates

# The one part of this repository that resolves the registry. Every manifest
# under templates/ pins a published release rather than the sources beside it,
# because that is what a user's copy has to build against — so these checks are
# answerable at every commit, and an API change on `main` leaves them alone
# until RELEASE.md retargets the pins.
#
# That is also why this is its own workflow rather than a job in ci.yml: it is
# not the release gate, and a framework pull request should not pay for it.

on:
  push:
    branches: [main]
    paths: ['templates/**', 'jo-templates.jsonl', '.github/workflows/templates.yml']
  pull_request:
    branches: [main]
    paths: ['templates/**', 'jo-templates.jsonl', '.github/workflows/templates.yml']

env:
  JO_REGISTRY_URL: https://pkg.typescope.ai

jobs:
  agent:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # One runner per agent, so each starts clean and a failure names the agent
    # that failed without the others hiding it.
    strategy:
      fail-fast: false
      matrix:
        agent: [hello, web, telegram, pr-review, flight-booker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The installed `jo` launcher runs jo.jar on the JVM, so a JDK is required.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17

      # Pinned rather than taken from the runner image, so a red build means an
      # agent broke and never that the image moved to a Python some agent's
      # requirements have no wheel for yet.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jo
        run: |
          curl -sSf https://jo-lang.org/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install requirements
        working-directory: templates/${{ matrix.agent }}
        run: pip install -r requirements.txt

      # One spec per capability. Every agent here grants exactly one and keeps
      # it in sandbox/. An agent granting several would keep one directory each,
      # and the loop builds either shape.
      - name: Build the sandbox guests
        working-directory: templates/${{ matrix.agent }}
        run: |
          for spec in sandbox/jo.toml sandbox/*/jo.toml; do
            [ -f "$spec" ] || continue
            echo "::group::$spec"
            jo build --spec "$spec" guest
            echo "::endgroup::"
          done

      - name: Build the agent
        working-directory: templates/${{ matrix.agent }}
        run: jo build agent

      # Agents that ship a suite run it. `hello` deliberately has none.
      - name: Test
        working-directory: templates/${{ matrix.agent }}
        run: |
          if [ -d tests ]; then jo run tests; else echo "no tests for ${{ matrix.agent }}"; fi

  # The path a user actually takes. It needs the repository to be public — `jo
  # new` fetches over plain HTTPS and cannot authenticate — so it stays disabled
  # until then rather than failing on every run.
  #
  #  jo new probe --template typescope/harpe#${{ github.sha }}:web
