name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/fetch-api-docs.sh'
      - 'docs/api-versions.jsonl'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch versioned API documentation
        run: .github/scripts/fetch-api-docs.sh

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - name: Build (also checks internal links)
        working-directory: docs
        run: zola build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: docs/public

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
