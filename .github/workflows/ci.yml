name: CI

on:
  push:
  pull_request:

jobs:
  jo:
    name: Jo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Jo
        run: |
          curl -sSf https://jo-lang.org/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Jo install
        run: jo --help

      - name: Build example
        working-directory: example
        run: jo build

      - name: Build example-web
        working-directory: example-web
        run: jo build

      - name: Test agent
        working-directory: agent
        run: jo test
