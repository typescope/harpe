name: CI

# Nothing here resolves the registry. The framework is built from this branch's
# sources, and so is the CLI agent — the one application still in this repository,
# kept because it is the framework's only end-to-end coverage.
#
# That is what makes every check answerable by the pull request that breaks it.
# The other agents live in typescope/agents, pinned to a published release, so a
# breaking API change no longer has to be made in six places at once.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jo:
    name: Jo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The installed `jo` launcher runs jo.jar on the JVM, so a JDK is required
      # (but not scala-cli — we install a released build rather than compile one).
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17

      - name: Install Jo
        run: |
          curl -sSf https://jo-lang.org/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Jo install
        run: jo --version

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Test the framework
        run: jo run test

      - name: Build the CLI agent
        working-directory: cli
        run: jo build agent

      - name: Build the CLI sandbox guest
        working-directory: cli
        run: jo build --spec sandbox/jo.toml guest

      # Builds the agent from its own manifest, starts it as its own process, and
      # types at it through a pseudo-terminal against a scripted model. No network,
      # no API key.
      - name: Test the CLI agent end to end
        working-directory: cli
        run: jo run tests
