name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jo:
    name: Jo
    runs-on: ubuntu-latest
    env:
      JO_REGISTRY_URL: https://pkg.typescope.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The installed `jo` launcher runs jo.jar on the JVM, so a JDK is required
      # (but not scala-cli — we install a released build rather than compile one).
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: 17

      - name: Install Jo
        run: |
          curl -sSf https://jo-lang.org/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Jo install
        run: jo --version

      # Every driver, built against this branch's own caps/ and agent/ sources via
      # the ci/*.toml specs. These catch a framework change that breaks a driver on
      # the same commit that makes it, which the package builds below cannot: those
      # resolve the last PUBLISHED harpe, so a driver updated alongside a new API
      # stays red there until that API ships in a release.
      - name: Build hello agent
        run: jo build hello --spec ci/hello.toml

      - name: Build hello sandbox guest
        run: jo build sandbox-guest --spec ci/hello.toml

      - name: Build CLI agent (local sources)
        run: jo build cli --spec ci/cli.toml

      - name: Build CLI sandbox guest (local sources)
        run: jo build sandbox-guest --spec ci/cli.toml

      - name: Build web agent (local sources)
        run: jo build web --spec ci/web.toml

      - name: Build web sandbox guest (local sources)
        run: jo build sandbox-guest --spec ci/web.toml

      - name: Build Telegram agent (local sources)
        run: jo build telegram --spec ci/telegram.toml

      - name: Build Telegram sandbox guest (local sources)
        run: jo build sandbox-guest --spec ci/telegram.toml

      # The same drivers from their own jo.toml, resolving harpe and harpe-caps
      # from the registry — the check that a shipped release still builds them.
      - name: Build CLI agent
        working-directory: cli
        run: jo build

      - name: Build CLI sandbox guest
        working-directory: cli
        run: jo build guest --spec sandbox/jo.toml

      - name: Build web agent
        working-directory: web
        run: jo build

      - name: Build web sandbox guest
        working-directory: web
        run: jo build guest --spec sandbox/jo.toml

      - name: Build Telegram agent
        working-directory: telegram
        run: jo build

      - name: Build Telegram sandbox guest
        working-directory: telegram
        run: jo build guest --spec sandbox/jo.toml

      - name: Build PR review agent
        working-directory: examples/pr-review
        run: jo build

      - name: Build PR review sandbox guest
        working-directory: examples/pr-review
        run: jo build guest --spec sandbox/jo.toml

      - name: Build pycompose
        run: jo build pycompose

      # The compiled Python reaches these dependencies only at run time. They
      # cover the agent media processors and the pycompose Cairo backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pycompose/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Install pycompose dependencies
        working-directory: pycompose
        run: pip install -r requirements.txt

      - name: Test agent library
        run: jo run test

      - name: Test pycompose
        run: jo run pycompose
