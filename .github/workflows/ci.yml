name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jo:
    name: Jo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Scala CLI
        uses: VirtusLab/scala-cli-setup@main
        with:
          jvm: liberica:17

      - name: Install Jo
        run: |
          git clone https://github.com/typescope/jo.git /tmp/jo
          cd /tmp/jo
          bin/install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Jo install
        run: jo --help

      - name: Build example
        working-directory: example
        run: jo build

      - name: Build example-web
        working-directory: example-web
        run: jo build

      - name: Test agent
        working-directory: agent
        run: jo test
