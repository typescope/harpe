<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>404 Not Found</title>
<style>
  :root { color-scheme: light dark; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    background: #fafafa;
  }

  main { text-align: center; padding: 2rem; }

  .code {
    margin: 0;
    font-size: 3.5rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .message { margin: 0.5rem 0 0; color: #666; }

  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #17171a; }
    .message { color: #9a9a9a; }
  }
</style>
<main>
  <p class="code">404</p>
  <p class="message">That page does not exist.</p>
</main>
