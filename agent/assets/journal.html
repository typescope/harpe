<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ · harpe journal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='8' y1='56' x2='56' y2='8' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232f6ada'/%3E%3Cstop offset='1' stop-color='%237b4ddb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cg fill='white'%3E%3Crect x='16' y='18' width='6' height='6' rx='1' opacity='.7'/%3E%3Crect x='28' y='18.5' width='20' height='5' rx='2.5'/%3E%3Crect x='16' y='29' width='6' height='6' rx='1' opacity='.7'/%3E%3Crect x='28' y='29.5' width='15' height='5' rx='2.5'/%3E%3Crect x='16' y='40' width='6' height='6' rx='1' opacity='.7'/%3E%3Crect x='28' y='40.5' width='22' height='5' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
<style>__STYLE__</style>

<header>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <defs>
        <linearGradient id="mark-gradient" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse">
          <stop stop-color="#2f6ada"/>
          <stop offset="1" stop-color="#7b4ddb"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="18" fill="url(#mark-gradient)"/>
      <g fill="white">
        <rect x="16" y="18" width="6" height="6" rx="1" opacity=".7"/>
        <rect x="28" y="18.5" width="20" height="5" rx="2.5"/>
        <rect x="16" y="29" width="6" height="6" rx="1" opacity=".7"/>
        <rect x="28" y="29.5" width="15" height="5" rx="2.5"/>
        <rect x="16" y="40" width="6" height="6" rx="1" opacity=".7"/>
        <rect x="28" y="40.5" width="22" height="5" rx="2.5"/>
      </g>
    </svg>
  </span>

  <span class="ident">
    <span class="name" id="name">__NAME__</span>
    <span class="kicker">harpe journal</span>
  </span>

  <span class="search">
    <input type="search" id="filter" placeholder="filter entries…" spellcheck="false">
    <kbd>/</kbd>
  </span>

  <span class="toggles">
    <label><input type="checkbox" id="follow" checked> follow</label>
  </span>

  <span class="state">
    <span class="pill"><i class="dot" id="dot"></i><span id="status">connecting</span></span>
    <span class="pill quiet" id="counts">0 entries</span>
  </span>
</header>

<!-- One lane per prefix of the selected path: the leftmost is the whole
     journal, each one to its right is a scope narrower. -->
<main id="lanes">
  <p class="placeholder">Waiting for the first entry…</p>
</main>

<!-- The record behind a row, as the server sent it. What the viewer groups on is
     derived, so being able to check a card against its raw entries is how you
     tell a wrong grouping from a wrong log. -->
<dialog id="raw">
  <header>
    <span id="rawEvent" class="cat"></span>
    <span id="rawScope" class="scope"></span>
    <button type="button" id="rawClose" aria-label="Close">✕</button>
  </header>
  <pre id="rawBody"></pre>
</dialog>

<script>__SCRIPT__</script>
