jo   = "0.11"
name = "harpe"

[package]
version = "0.1.0"
runtime = "python"

[main]
compile-options = ["--test-pickling", "--check-tree"]

# Unit tests (jo test). The package runtime (python) propagates to the test
# module, so test sources can use `py.*` to build scaffolding directly.
[test]
src = ["tests/"]
