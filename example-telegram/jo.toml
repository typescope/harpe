jo   = "0.11"
name = "hello-telegram"

[main]
target = "python"

[main.dependencies]
harpe-telegram = { path = "../telegram" }

[main.links]
"jo.main" = "harpe.telegram.main"
# Use the keyless echo model so the plumbing runs with no LLM API key (you still
# need a TELEGRAM_BOT_TOKEN). Drop this link to fall back to the Anthropic
# default (set ANTHROPIC_API_KEY in .env).
# "harpe.telegram.Config.model" = "TelegramExample.model"

[commands]
start = "jo build --spec sandbox/guest/jo.toml && jo run"
