jo = "0.12"

[module.cli]
kind = "app"
platform = "python"
enable-ffi = true
src = ["../../cli/src/"]
modules = [{ id = "harpe", path = "../.." }]

links = [
  { from = "jo.main", to = "harpe.cli.main" },
]

[module.sandbox-api]
kind = "lib"
platform = "python"
src = ["../../cli/sandbox/SandboxAPI.jo"]
modules = [{ id = "caps", path = "../.." }]

[module.sandbox-runtime]
kind = "lib"
platform = "python"
enable-ffi = true
src = ["../../cli/sandbox/SandboxRuntime.jo"]
modules = ["sandbox-api", { id = "harpe", path = "../.." }]

[module.sandbox-guest]
kind = "app"
platform = "python"
src = ["../../cli/sandbox/Task.jo"]
modules = [
  "sandbox-api",
  { id = "caps", path = "../.." },
  { id = "sandbox-runtime", link = true },
]

links = [
  { from = "jo.main", to = "sandbox.runtime.main" },
  { from = "sandbox.api.runTask", to = "sandbox.guest.runTask" },
]

# The journal viewer — see the driver's own jo.toml. Built here so CI proves the
# link target still exists.
[module.view]
kind = "app"
platform = "python"
enable-ffi = true
src = []
modules = [{ id = "harpe", path = "../.." }]

links = [
  { from = "jo.main", to = "harpe.transcript.serve" },
]
