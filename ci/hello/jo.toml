jo = "0.12"

[module.hello]
kind = "app"
platform = "python"
enable-ffi = true
src = ["../../templates/hello/src/"]
modules = [{ id = "harpe", path = "../.." }]

links = [
  { from = "jo.main", to = "hello.main" },
]

[module.sandbox-api]
kind = "lib"
platform = "python"
src = ["../../templates/hello/sandbox/SandboxAPI.jo"]

[module.sandbox-runtime]
kind = "lib"
platform = "python"
src = ["../../templates/hello/sandbox/SandboxRuntime.jo"]
modules = ["sandbox-api"]

[module.sandbox-guest]
kind = "app"
platform = "python"
src = ["../../templates/hello/sandbox/Task.jo"]
modules = ["sandbox-api", { id = "sandbox-runtime", link = true }]

links = [
  { from = "jo.main", to = "sandbox.runtime.main" },
  { from = "sandbox.api.runTask", to = "sandbox.guest.runTask" },
]
