jo = "0.12"

# The capability interfaces a sandbox guest may be granted — pure Jo, no FFI, so a
# guest module can depend on it without the harpe module (and its implementations)
# ever entering the guest's dependency graph.
[module.caps]
kind = "lib"
platform = "python"
src = ["caps/"]
compile-options = ["--test-pickling", "--check-tree"]

[module.caps.package]
name = "harpe-caps"
version = "0.1.0"

[module.harpe]
kind = "lib"
platform = "python"
src = ["agent/"]
compile-options = ["--test-pickling", "--check-tree"]
enable-ffi = true
modules = ["caps"]

[module.harpe.package]
name = "harpe"
version = "0.1.0"

[module.test]
kind = "app"
platform = "python"
enable-ffi = true
modules = ["harpe", "caps"]
src = ["tests/"]
