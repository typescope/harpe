jo = "0.13"

# The capability interfaces a sandbox guest may be granted — pure Jo, no FFI, so a
# guest module can depend on it without the harpe module (and its implementations)
# ever entering the guest's dependency graph.
[module.caps]
kind = "lib"
platform = "pure"
src = ["caps/"]
compile-options = ["--test-pickling", "--check-tree"]
doc-options = ["--title", "harpe-caps"]

[module.caps.package]
name = "harpe-caps"
version = "0.13.0"

[module.harpe]
kind = "lib"
platform = "python"
src = ["agent/"]
resources = ["agent/assets/:assets/"]
compile-options = ["--test-pickling", "--check-tree"]
doc-options = ["--title", "harpe"]
enable-ffi = true
modules = ["caps"]

[module.harpe.package]
name = "harpe"
version = "0.13.0"

# A seeded journal, served, for looking at the viewer by hand — a plain
# exchange, two interleaved sessions, and a lane of deliberate extremes.
#
#     jo run viewer
# Every line of it is harpe's, linked in as this module's entry point — hence
# no sources of its own.
[module.viewer]
kind = "app"
platform = "python"
enable-ffi = true
modules = ["harpe", "caps"]
src = []

links = [
  { from = "jo.main", to = "harpe.observability.test" },
]

[module.test]
kind = "app"
platform = "python"
enable-ffi = true
depth = 2
modules = ["harpe", "caps"]
packages = [
  { name = "jtest-python", version = "0.1" }
]
src = ["tests/"]
