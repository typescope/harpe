jo = "0.13"

# The capability interfaces a sandbox guest may be granted — pure Jo, no FFI, so a
# guest module can depend on it without the harpe module (and its implementations)
# ever entering the guest's dependency graph.
[module.caps]
kind = "lib"
platform = "pure"
src = ["caps/"]
compile-options = ["--test-pickling", "--check-tree"]

[module.caps.package]
name = "harpe-caps"
version = "0.9.0"

[module.harpe]
kind = "lib"
platform = "python"
src = ["agent/"]
resources = ["agent/assets/:assets/"]
compile-options = ["--test-pickling", "--check-tree"]
enable-ffi = true
modules = ["caps"]

[module.harpe.package]
name = "harpe"
version = "0.9.0"

# The test framework, published as `harpe-testing`: the suite tree, the runner,
# and the assertions.
#
# It depends on nothing — not even `harpe`. Nothing in it knows what an agent is:
# the harness that builds and drives one lives in `tests/e2e/`, and the provider
# fixture in `tests/integration/`, because both are shaped by this repository's
# own layout. The nine host calls it makes are bound in `testing/Platform.jo`
# rather than borrowed from `harpe.ffi`, which is what keeps it free-standing.
#
# It is a package rather than part of `tests/` so that a project outside this
# repository can declare a test module against it. Nothing elsewhere can reach
# into `tests/`.
[module.testing]
kind = "lib"
platform = "python"
enable-ffi = true
src = ["testing/"]
compile-options = ["--test-pickling", "--check-tree"]

[module.testing.package]
name = "harpe-testing"
version = "0.9.0"

# A seeded journal, served, for looking at the viewer by hand — a plain
# exchange, two interleaved sessions, and a lane of deliberate extremes.
#
#     jo run viewer
# Every line of it is harpe's, linked in as this module's entry point — hence
# no sources of its own.
[module.viewer]
kind = "app"
platform = "python"
enable-ffi = true
modules = ["harpe", "caps"]
src = []

links = [
  { from = "jo.main", to = "harpe.observability.test" },
]

[module.test]
kind = "app"
platform = "python"
enable-ffi = true
modules = ["harpe", "caps", "testing"]
src = ["tests/"]
