jo = "0.13"

# The api module declares the Duffel capability surface: the types and interface
# the LLM writes against. No harpe dependency — just jo stdlib. The guest (which
# depends on api) names the capability, never the runtime implementation.
[module.api]
kind = "lib"
platform = "python"
src = ["API.jo"]

[module.runtime]
kind = "lib"
platform = "python"
enable-ffi = true
src = ["Runtime.jo", "DuffelClient.jo"]
depth = 2

modules = ["api"]
packages = [{ name = "harpe", version = "0.10" }]

[module.guest]
kind = "app"
platform = "python"
src = ["Task.jo"]
depth = 2

modules = ["api", { id = "runtime", link = true }]

links = [
  { from = "jo.main", to = "sandbox.runtime.main" },
  { from = "sandbox.api.runTask", to = "sandbox.guest.runTask" },
]
