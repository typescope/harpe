jo = "0.13"

[module.agent]
kind = "app"
platform = "python"
enable-ffi = true
src = ["src/"]
depth = 2

packages = [{ name = "harpe", version = "0.11" }]

links = [
  { from = "jo.main", to = "web.main" },
]

# The journal viewer: a live browser view of one session's structured log.
# Every line of it is harpe's, linked in as this module's entry point — hence
# no sources of its own.
#
#     jo run view -- logs/sessions/<session>.jsonl
[module.view]
kind = "app"
platform = "python"
enable-ffi = true
src = []
depth = 2

packages = [{ name = "harpe", version = "0.11" }]

links = [
  { from = "jo.main", to = "harpe.transcript.serve" },
]

# This agent's own end-to-end suite. It builds the agent through the manifest
# above, starts it as its own process, and drives it over HTTP against a scripted
# model — so it exercises what a user actually runs, not a library call.
[module.tests]
kind = "app"
platform = "python"
enable-ffi = true
src = ["tests/"]
depth = 2

packages = [
  { name = "harpe", version = "0.11" },
  { name = "harpe-testing", version = "0.11" },
]

links = [
  { from = "jo.main", to = "web.tests.Main.main" },
]

[commands]
start = "jo build --spec sandbox/jo.toml guest && jo run"
