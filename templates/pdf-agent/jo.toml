jo = "0.13"

[module.agent]
kind = "app"
platform = "python"
enable-ffi = true
src = ["src/"]
depth = 2

packages = [{ name = "harpe", version = "0.12" }]

links = [
  { from = "jo.main", to = "pdf.agent.main" },
]

# This agent's own end-to-end suite. It builds the agent through the manifest
# above, starts it as its own process, and drives it over HTTP against a scripted
# model — so it exercises what a user actually runs, not a library call.
[module.tests]
kind = "app"
platform = "python"
enable-ffi = true
src = ["tests/"]
depth = 2

packages = [
  { name = "harpe", version = "0.12" },
  { name = "harpe-testing-python", version = "0.12" },
]

links = [
  { from = "jo.main", to = "pdf.agent.tests.Main.main" },
]

[commands]
start = "jo build --spec sandbox/jo.toml guest && jo run"
