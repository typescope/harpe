<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="doctitle">Clair</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="agent-name" id="title" title="New chat">Clair</span>
      <button id="collapse" class="icon-btn" aria-label="Collapse panel" title="Collapse panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
    </div>
    <button id="newchat" class="newchat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"></path></svg>
      New chat
    </button>
    <div class="panel-section">Recent</div>
    <div id="sessions" class="sessions"></div>
    <a class="journal-link" href="/journal" target="_blank" rel="noopener" title="Open live logs in a new tab">Logs <span aria-hidden="true">↗</span></a>
    <div class="powered">Powered by <a class="mark" href="https://harpe.typescope.ai" target="_blank" rel="noopener">HARPE</a></div>
  </aside>
  <button id="opener" class="icon-btn opener" aria-label="Open panel" title="Open panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <div class="chat">
    <main>
      <div id="empty" class="empty">Start the conversation &mdash; ask Clair anything.</div>
      <div id="loading" class="loading" style="display: none"><span class="dot"></span>Loading conversation&hellip;</div>
      <div id="messages"></div>
    </main>
    <footer>
      <div id="pending" class="pending" style="display: none"></div>
      <div class="composer">
        <button id="files-toggle" class="cbtn" aria-label="Session files" title="Session files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </button>
        <button id="attach" class="cbtn" aria-label="Attach files" title="Attach files">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49"></path></svg>
        </button>
        <input id="file-input" type="file" multiple style="display: none">
        <textarea id="input" rows="1" placeholder="Message Clair..."></textarea>
        <button id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
      <div class="hint">Enter to send, Shift+Enter for a new line. Attach files with the clip, or drag them in.</div>
    </footer>
  </div>
  <aside id="files-panel">
    <div class="panel-head">
      <span class="ttl">Session files</span>
      <button id="files-close" class="icon-btn" aria-label="Close files" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="files-list"></div>
  </aside>

  <div id="editor" class="editor-modal" style="display: none">
    <div class="editor-box">
      <div class="editor-head">
        <svg class="editor-file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-3 3 3 3"></path><path d="M16 9l3 3-3 3"></path><path d="M13.5 7l-3 10"></path></svg>
        <input id="editor-name" class="editor-name" placeholder="filename.jo" spellcheck="false" autocomplete="off">
        <span class="editor-head-sp"></span>
        <button id="editor-run" class="ed-icon ed-run-icon" aria-label="Run" title="Run  (Ctrl/⌘ + Enter)">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20" fill="currentColor"></polygon></svg>
          <svg class="ico-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
        </button>
        <button id="editor-save" class="ed-icon" aria-label="Save" title="Save to session files">
          <svg class="ico-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <svg class="ico-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <span class="editor-win">
          <button id="editor-full" class="icon-btn" aria-label="Toggle full screen" title="Full screen">
            <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
            <svg class="ico-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>
          </button>
          <button id="editor-close" class="icon-btn" aria-label="Close editor" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </span>
      </div>
      <div class="editor-code-wrap">
        <textarea id="editor-code" class="editor-code" spellcheck="false" placeholder="namespace sandbox.guest&#10;&#10;def runTask(): Unit =&#10;  println &quot;hello&quot;"></textarea>
      </div>
      <div id="editor-split" class="editor-split" title="Drag to resize"></div>
      <div id="editor-output" class="editor-output"></div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
