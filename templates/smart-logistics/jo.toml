jo = "0.13"

[module.agent]
kind = "app"
platform = "python"
enable-ffi = true
src = ["src/"]
depth = 2

packages = [{ name = "harpe", version = "0.9" }]

links = [
  { from = "jo.main", to = "smart.logistics.main" },
]

# This agent's own suite. It compiles guest programs against a copy of the
# sandbox and runs them, so it exercises the capability boundary itself rather
# than a library call. No API key and no network.
[module.tests]
kind = "app"
platform = "python"
enable-ffi = true
src = ["tests/", "src/db/"]
depth = 2

packages = [
  { name = "harpe", version = "0.9" },
  { name = "harpe-testing", version = "0.9" },
]

links = [
  { from = "jo.main", to = "smart.logistics.tests.Main.main" },
]

[commands]
start = "jo build --spec sandbox/watch/jo.toml guest && jo build --spec sandbox/plan/jo.toml guest && jo run agent"
