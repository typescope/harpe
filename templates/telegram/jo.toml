jo = "0.13"

[module.agent]
kind = "app"
platform = "python"
enable-ffi = true
src = ["src/"]
depth = 2

packages = [{ name = "harpe", version = "0.9" }]

links = [
  { from = "jo.main", to = "harpe.telegram.main" },
]

# The journal viewer: a live browser view of one session's structured log.
# Every line of it is harpe's, linked in as this module's entry point — hence
# no sources of its own.
#
#     jo run view -- logs/sessions/<session>.jsonl
[module.view]
kind = "app"
platform = "python"
enable-ffi = true
src = []
depth = 2

packages = [{ name = "harpe", version = "0.9" }]

links = [
  { from = "jo.main", to = "harpe.transcript.serve" },
]

[commands]
start = "jo build --spec sandbox/jo.toml guest && jo run"
